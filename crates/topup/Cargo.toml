[package]
name = "topup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "topup"
path = "src/main.rs"

[features]
dev-signer = ["topup-adapters/dev-signer"]

[dependencies]
clap.workspace = true
hex.workspace = true
serde_json.workspace = true
topup-adapters = { path = "../adapters" }
topup-core = { path = "../core" }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
