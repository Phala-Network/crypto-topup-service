# Fully valid schema fixture. Addresses are from the A1 deterministic test-vector deployment.
# It overrides defaults the tests rely on: providers, the chain defaults (so tests may change the
# chain id), crediting only at `finalized` (so the suite checks that `finalized` reproduces the
# behaviour before fast credit), and the deposit and flush floors.
route: phala-cloud-ethereum-pha-usd
version: 1
product: phala-cloud

chain:
  chain_id: 1
  forwarder_factory: "0xe8A9Ab1AbC7651A5b7C2ED5B662F2f80BF5C446d"
  treasury: "0x0000000000000000000000000000000000007EA5"
  confirmations: finalized
  sanctions_oracle: "0x40C57923924B5c5c5455c48D93317139ADDaC8fb"
  rpc_providers: [alchemy, quicknode]
  flush:
    native_price_asset: eth
    min_operator_balance_wei: "10000000000000000"

asset:
  symbol: pha
  contract: "0x6c5bA91642F10282b576d91922Ae6448C9d52f4E"
  decimals: 18

pricing:
  primary: { source: coinmetrics, asset: pha }
  check: { source: binance, symbol: PHAUSDT }

limits:
  min_credit_minor: 100
  max_deposit_atomic: "200000000000000000000000"
  min_refund_atomic: "20"
  max_open_minor: { account: 500000, product: 5000000, global: 10000000 }
  min_deposit_atomic: "20000000000000000000"
  min_flush_atomic: "20000000000000000000000"
