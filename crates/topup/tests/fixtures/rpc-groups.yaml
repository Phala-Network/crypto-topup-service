rpc_companies:
  alchemy: { domains: [alchemy.com] }
  quicknode: { domains: [rpc.example] }
rpc_budgets:
  alchemy-account: { requests_per_second: 20, burst: 20 }
  alchemy-key: { requests_per_second: 10, burst: 10 }
  quicknode-account: { requests_per_second: 20, burst: 20 }
  quicknode-key: { requests_per_second: 10, burst: 10 }
rpc_groups:
  alchemy:
    chain_id: 1
    members:
      - id: alchemy
        company: alchemy
        url: https://eth-mainnet.g.alchemy.com/v2/{key}
        sealed_key: TOPUP_RPC_ALCHEMY_KEY
        account_budget: alchemy-account
        key_budget: alchemy-key
  quicknode:
    chain_id: 1
    members:
      - id: quicknode
        company: quicknode
        url: https://rpc.example/eth
        account_budget: quicknode-account
        key_budget: quicknode-key
