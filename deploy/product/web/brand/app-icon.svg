<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The mark full-bleed, for platforms that round or mask icons themselves (iOS; Android's
       maskable icons). The dot keeps its 3/8 and sits well inside the maskable safe zone, the
       centred circle of 80% diameter. -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <rect x="10" y="10" width="12" height="12" rx="3" fill="#cefc5d"/>
</svg>
