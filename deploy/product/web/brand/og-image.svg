<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="1120" cy="-60" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cefc5d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#cefc5d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="Geist Variable" fill="#fafafa">
    <!-- The page's logo mark (src/Site.tsx) and wordmark, and its address. -->
    <g transform="translate(80 76) scale(2.5)">
      <rect width="24" height="24" rx="6" fill="#0a0a0a"/>
      <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="none" stroke="#fff" stroke-opacity="0.18"/>
      <rect x="7" y="7" width="10" height="10" rx="3" fill="#cefc5d"/>
    </g>
    <text x="160" y="119" font-size="38" font-weight="600" letter-spacing="-0.8">Phala Pay</text>
    <text x="1120" y="117" font-size="26" font-weight="450" fill="#a1a1a1" text-anchor="end">pay.phala.com</text>

    <!-- The hero's headline. -->
    <text font-size="78" font-weight="600" letter-spacing="-2.6">
      <tspan x="76" y="298">Fast, secure, non-custodial</tspan>
      <tspan x="76" y="388">crypto payments<tspan fill="#cefc5d">.</tspan></tspan>
    </text>

    <!-- Its subtitle, one fact per word. -->
    <g font-size="27" font-weight="450" fill="#d4d4d4">
      <rect x="80" y="469" width="12" height="12" rx="3" fill="#cefc5d"/>
      <text x="108" y="484">Credited in about 15 s on Ethereum</text>
      <rect x="620" y="469" width="12" height="12" rx="3" fill="#cefc5d"/>
      <text x="648" y="484">Runs in a TEE, with attestation</text>
      <rect x="80" y="527" width="12" height="12" rx="3" fill="#cefc5d"/>
      <text x="108" y="542">Addresses pay only your treasury</text>
      <rect x="620" y="527" width="12" height="12" rx="3" fill="#cefc5d"/>
      <text x="648" y="542">Stripe-shaped API, open source</text>
    </g>
  </g>
</svg>
