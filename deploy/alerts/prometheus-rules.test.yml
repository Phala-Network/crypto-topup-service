rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  - name: zero gas balance alerts for an enabled producer
    interval: 1m
    input_series:
      - series: 'topup_operator_gas_balance_wei{chain="1",producer_enabled="true"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TopupOperatorGasReserveLow
        exp_alerts:
          - exp_labels:
              chain: "1"
              producer_enabled: "true"
              severity: page
            exp_annotations:
              summary: Operator gas reserve is below 0.001 native token

  - name: a new reconciliation mismatch alerts
    interval: 1m
    input_series:
      - series: 'topup_reconciliation_mismatches_total{check="balances",producer_enabled="true"}'
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: TopupReconciliationMismatch
        exp_alerts:
          - exp_labels:
              check: balances
              producer_enabled: "true"
              severity: page
            exp_annotations:
              summary: Reconciliation found a new mismatch

  - name: one missing worker alerts without losing scrape target identity
    interval: 1m
    input_series:
      - series: 'topup_loop_expected{loop="scanner",loop_instance="0",instance="topup:9464",producer_enabled="true"}'
        values: '1x5'
      - series: 'topup_loop_heartbeat_unixtime_seconds{loop="scanner",loop_instance="0",instance="topup:9464",producer_enabled="true"}'
        values: '0+60x5'
      - series: 'topup_loop_wait_until_unixtime_seconds{loop="scanner",loop_instance="0",instance="topup:9464",producer_enabled="true"}'
        values: '0x5'
      - series: 'topup_loop_deadline_unixtime_seconds{loop="scanner",loop_instance="0",instance="topup:9464",producer_enabled="true"}'
        values: '0x5'
      - series: 'topup_loop_expected{loop="scanner",loop_instance="1",instance="topup:9464",producer_enabled="true"}'
        values: '1x5'
      - series: 'topup_loop_wait_until_unixtime_seconds{loop="scanner",loop_instance="1",instance="topup:9464",producer_enabled="true"}'
        values: '0x5'
      - series: 'topup_loop_deadline_unixtime_seconds{loop="scanner",loop_instance="1",instance="topup:9464",producer_enabled="true"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: TopupLoopStopped
        exp_alerts:
          - exp_labels:
              instance: "topup:9464"
              loop: scanner
              loop_instance: "1"
              producer_enabled: "true"
              severity: page
            exp_annotations:
              summary: Service loop heartbeat stopped

  - name: intentional long wait suppresses a stale heartbeat alert
    interval: 1m
    input_series:
      - series: 'topup_loop_expected{loop="scanner",loop_instance="1",producer_enabled="true"}'
        values: '1x10'
      - series: 'topup_loop_heartbeat_unixtime_seconds{loop="scanner",loop_instance="1",producer_enabled="true"}'
        values: '1x10'
      - series: 'topup_loop_wait_until_unixtime_seconds{loop="scanner",loop_instance="1",producer_enabled="true"}'
        values: '3600x10'
      - series: 'topup_loop_deadline_unixtime_seconds{loop="scanner",loop_instance="1",producer_enabled="true"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TopupLoopStopped
        exp_alerts: []

  - name: a pump step using its full 240s timeout does not page
    interval: 1m
    input_series:
      - series: 'topup_loop_expected{loop="pump",loop_instance="0",producer_enabled="true"}'
        values: '1x10'
      # The step starts at 1m and never finishes; its deadline is heartbeat + 240s.
      - series: 'topup_loop_heartbeat_unixtime_seconds{loop="pump",loop_instance="0",producer_enabled="true"}'
        values: '0 60x10'
      - series: 'topup_loop_wait_until_unixtime_seconds{loop="pump",loop_instance="0",producer_enabled="true"}'
        values: '0x10'
      - series: 'topup_loop_deadline_unixtime_seconds{loop="pump",loop_instance="0",producer_enabled="true"}'
        values: '0 300x10'
    alert_rule_test:
      # Without the deadline the 120s heartbeat threshold plus `for: 1m` would fire at 5m.
      - eval_time: 4m
        alertname: TopupLoopStopped
        exp_alerts: []
      - eval_time: 5m
        alertname: TopupLoopStopped
        exp_alerts: []
      - eval_time: 6m
        alertname: TopupLoopStopped
        exp_alerts:
          - exp_labels:
              loop: pump
              loop_instance: "0"
              producer_enabled: "true"
              severity: page
            exp_annotations:
              summary: Service loop heartbeat stopped
