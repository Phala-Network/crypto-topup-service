# Phala's staging instance: the environment's public settings that are third-party env interfaces
# (WAL-G's backup location, dstack-ingress's domain) and the sealed key names of its RPC providers.
# topup's own settings are in topup.yaml.
services:
  postgres:
    environment: &walg
      WALG_S3_PREFIX: s3://crypto-topup-test/staging-v030
      AWS_ENDPOINT: https://1d694c298092ffa09c793cbca4587812.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_S3_FORCE_PATH_STYLE: "true"
  backup:
    environment: *walg
  dstack-ingress:
    environment:
      DOMAIN: pay-api-staging.phala.com
  # Staging's providers are keyless; these two names stay sealed (empty) so the CVM's allowed names
  # are unchanged. A keyed provider adds its TOPUP_RPC_<ID>_KEY here, to both services.
  topup:
    environment: &rpc-keys
      TOPUP_RPC_PROVIDER_A_KEY: ${TOPUP_RPC_PROVIDER_A_KEY:-}
      TOPUP_RPC_PROVIDER_B_KEY: ${TOPUP_RPC_PROVIDER_B_KEY:-}
  restore-check:
    environment: *rpc-keys
