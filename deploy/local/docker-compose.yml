services:
  dstack-simulator:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.dstack-simulator
    image: crypto-topup-dstack-simulator:local
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  postgres:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.postgres-walg
    image: crypto-topup-postgres-walg:local
    environment:
      POSTGRES_DB: topup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TOPUP_APP_PASSWORD: topup
      WALG_FILE_PREFIX: /var/lib/wal-g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walg_data:/var/lib/wal-g
      - ../postgres-init/10-topup-role.sh:/docker-entrypoint-initdb.d/10-topup-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d topup"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: crypto-topup-service:local
    command: ["topup", "migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/topup
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  topup:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    image: crypto-topup-service:local
    command:
      - topup
      - run
      - --bind
      - 0.0.0.0:8080
      - --route
      - /etc/topup/routes/phala-cloud-sepolia-pha.yaml
    environment:
      DATABASE_URL: postgres://topup_service:topup@postgres:5432/topup
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_ADMIN_KID: local-admin/v1
      TOPUP_ADMIN_PUBLIC_KEY: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
      TOPUP_PUBLIC_ORIGIN: http://127.0.0.1:${TOPUP_LOCAL_PORT:-18080}
      TOPUP_RPC_PROVIDER_A_URL: http://127.0.0.1:1
      TOPUP_RPC_PROVIDER_B_URL: http://127.0.0.1:1
      TOPUP_CHAINS_DIR: /etc/topup/chains
      TOPUP_ROUTES_DIR: /etc/topup/routes
    volumes:
      - dstack_socket:/var/run
      - ../config/chains:/etc/topup/chains:ro
      - ${TOPUP_LOCAL_ROUTES_DIR:-../config/routes}:/etc/topup/routes:ro
    ports:
      - "127.0.0.1:${TOPUP_LOCAL_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "topup", "attest", "--nonce", "00"]
      interval: 10s
      timeout: 15s
      retries: 5
    depends_on:
      dstack-simulator:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backup:
    image: crypto-topup-postgres-walg:local
    user: postgres
    command: ["walg-cron", "backup-push", "0 3 * * *"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PGHOST: postgres
      PGDATABASE: topup
      PGUSER: postgres
      PGPASSWORD: postgres
      WALG_FILE_PREFIX: /var/lib/wal-g
      WALG_RETENTION_FULL: "2"
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - walg_data:/var/lib/wal-g
    healthcheck:
      test: ["CMD", "wal-g", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dstack_socket:
  pgdata:
  walg_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=999,gid=999,mode=0700
