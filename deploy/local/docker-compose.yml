# Local overlay for the attested stack, applied by deploy/local/compose.sh after the compose
# rendered for a local project (make up, the sandbox, and the restore drill), with local/service.yml
# or local/restore-check.yml for the variant's own services. It adds object storage
# (local/s3.compose.yml), the dstack simulator, and a mock product, builds the images from this
# checkout, and replaces host paths and ports with local ones. Everything else, including the
# configuration and the PostgreSQL init script (inline configs), comes from the rendered compose.
# Database credentials need no local value: `keys` derives them from the simulator exactly as in a
# CVM; compose.sh passes the local storage credentials.
#
# Paths here are relative to deploy/ (compose.sh's project directory). `!override` and `!reset`
# need Compose 2.24.4 or newer.
x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile
  args:
    SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    BUILD_JOBS: ${CARGO_BUILD_JOBS:-}

include:
  - local/s3.compose.yml

services:
  dstack-simulator:
    build:
      context: ..
      dockerfile: deploy/local/Dockerfile.dstack-simulator
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:-phala-pay-dstack-simulator:local}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mock-product:
    image: python:3.14-slim-trixie@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2
    command: ["python3", "/opt/topup/mock-product.py"]
    volumes:
      - ./local/mock-product.py:/opt/topup/mock-product.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keys:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres-walg
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-phala-pay-postgres-walg:local}
    environment:
      # The local Garage store is plain http (deploy/scripts/postgres-walg-entrypoint.sh).
      TOPUP_OBJECT_STORE_ALLOW_HTTP: "on"
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      s3-init:
        condition: service_completed_successfully

  migrate:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}

  topup:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
    ports: !override
      - "127.0.0.1:${TOPUP_LOCAL_PORT:-18080}:8080"
    healthcheck:
      interval: 10s
      retries: 5
    depends_on:
      dstack-simulator:
        condition: service_healthy

volumes:
  dstack_socket:
