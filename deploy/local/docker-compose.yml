# Local overlay for the attested stack:
#   docker compose -f deploy/docker-compose.yml -f deploy/local/docker-compose.yml ...
# It adds object storage (local/s3.compose.yml), the dstack simulator, and a mock product, builds
# the images from this checkout, and replaces secrets, ports, and host paths with local values.
# Everything else, including the PostgreSQL init script (an inline config), comes from
# deploy/docker-compose.yml. Database credentials need no local value: `keys` derives them from
# the simulator exactly as in a CVM.
#
# Compose resolves relative paths against the first file's directory, so paths here are relative
# to deploy/. `!override` and `!reset` need Compose 2.24.4 or newer.
x-walg-environment: &walg-environment
  WALG_S3_PREFIX: s3://topup-backups/postgres
  AWS_ENDPOINT: http://s3:3900
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
  # A restore phase switches to the read-only topup-restore-read key created by s3-init.
  AWS_ACCESS_KEY_ID: ${TOPUP_LOCAL_S3_ACCESS_KEY_ID:-topup-s3}
  AWS_SECRET_ACCESS_KEY: ${TOPUP_LOCAL_S3_SECRET_ACCESS_KEY:-topup-s3-secret-key}
  # The attested file reads AWS_SESSION_TOKEN from the shell; a developer's SSO token must never
  # reach the local S3 server.
  AWS_SESSION_TOKEN: ""

x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile
  args:
    SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}

include:
  - local/s3.compose.yml

services:
  dstack-simulator:
    build:
      context: ..
      dockerfile: deploy/local/Dockerfile.dstack-simulator
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:-crypto-topup-dstack-simulator:local}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mock-product:
    image: python:3.14-slim-trixie@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2
    command: ["python3", "/opt/topup/mock-product.py"]
    volumes:
      - ./local/mock-product.py:/opt/topup/mock-product.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keys:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres-walg
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      s3-init:
        condition: service_completed_successfully

  migrate:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}

  topup:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_ADMIN_KID: local-admin/v1
      TOPUP_ADMIN_PUBLIC_KEY: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
      TOPUP_PUBLIC_ORIGIN: http://127.0.0.1:${TOPUP_LOCAL_PORT:-18080}
      TOPUP_RPC_PROVIDER_A_URL: http://127.0.0.1:1
      TOPUP_RPC_PROVIDER_B_URL: http://127.0.0.1:1
    # Routes come from a directory so the sandbox and the restore drill can supply their own.
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    ports: !override
      - "127.0.0.1:${TOPUP_LOCAL_PORT:-18080}:8080"
      - "127.0.0.1:${TOPUP_LOCAL_METRICS_PORT:-19464}:9464"
    healthcheck:
      interval: 10s
      retries: 5
    depends_on:
      dstack-simulator:
        condition: service_healthy

  heartbeat:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}

  backup:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment
      WALG_RETENTION_FULL: "2"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  restore:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment

  restore-check:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_RPC_PROVIDER_A_URL: http://127.0.0.1:1
      TOPUP_RPC_PROVIDER_B_URL: http://127.0.0.1:1
    volumes: !override
      - dstack_socket:/var/run
      - db_owner:/run/db-owner:ro
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    depends_on:
      dstack-simulator:
        condition: service_healthy
      mock-product:
        condition: service_healthy

volumes:
  dstack_socket:
