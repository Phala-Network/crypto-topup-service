# Local overlay for the attested stack, applied by deploy/local/compose.sh after the compose
# rendered with local settings (make up, the sandbox, and the restore drill). It adds
# object storage (local/s3.compose.yml), the dstack simulator, and a mock product, builds the
# images from this checkout, and replaces secrets, ports, and host paths with local values. It
# never starts dstack-ingress: tls-alpn-01 needs a public DNS name and Let's Encrypt connecting
# through the dstack gateway (the upstream TESTING.md tests it only on a real CVM), so topup is
# published on a loopback port with that port as its origin.
# Everything else, including the PostgreSQL init script (an inline config), comes from the rendered
# deploy/docker-compose.yml. Database credentials need no local value: `keys` derives them from
# the simulator exactly as in a CVM.
#
# Paths here are relative to deploy/ (compose.sh's project directory). `!override` and `!reset`
# need Compose 2.24.4 or newer.
x-walg-environment: &walg-environment
  # A restore phase switches to the read-only topup-restore-read key created by s3-init.
  AWS_ACCESS_KEY_ID: ${TOPUP_LOCAL_S3_ACCESS_KEY_ID:-topup-s3}
  AWS_SECRET_ACCESS_KEY: ${TOPUP_LOCAL_S3_SECRET_ACCESS_KEY:-topup-s3-secret-key}

x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile
  args:
    SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}

include:
  - local/s3.compose.yml

services:
  dstack-simulator:
    build:
      context: ..
      dockerfile: deploy/local/Dockerfile.dstack-simulator
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:-phala-pay-dstack-simulator:local}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mock-product:
    image: python:3.14-slim-trixie@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2
    command: ["python3", "/opt/topup/mock-product.py"]
    volumes:
      - ./local/mock-product.py:/opt/topup/mock-product.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keys:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres-walg
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-phala-pay-postgres-walg:local}
    environment:
      <<: *walg-environment
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      s3-init:
        condition: service_completed_successfully

  migrate:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}

  topup:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_PUBLIC_ORIGIN: http://127.0.0.1:${TOPUP_LOCAL_PORT:-18080}
      # The attested file reads SENTRY_DSN from the shell; local stacks never report to Sentry.
      SENTRY_DSN: ""
    # Routes come from a directory so the sandbox and the restore drill can supply their own.
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    ports: !override
      - "127.0.0.1:${TOPUP_LOCAL_PORT:-18080}:8080"
    healthcheck:
      interval: 10s
      retries: 5
    depends_on:
      dstack-simulator:
        condition: service_healthy

  # A profile no local stack enables (see the header).
  dstack-ingress:
    profiles: [cvm]

  heartbeat:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}

  backup:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-phala-pay-postgres-walg:local}
    environment:
      <<: *walg-environment
      WALG_RETENTION_FULL: "2"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  restore:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-phala-pay-postgres-walg:local}
    environment:
      <<: *walg-environment

  restore-check:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-phala-pay:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - db_owner:/run/db-owner:ro
      - observability:/run/topup-observability
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    depends_on:
      dstack-simulator:
        condition: service_healthy
      mock-product:
        condition: service_healthy

volumes:
  dstack_socket:
