# Local overlay for the attested stack:
#   docker compose -f deploy/docker-compose.yml -f deploy/local/docker-compose.yml ...
# It adds MinIO, the dstack simulator, and a mock product, builds the images from this checkout,
# and replaces secrets, ports, and host paths with local values. Everything else, including the
# PostgreSQL init script (an inline config), comes from deploy/docker-compose.yml.
#
# Compose resolves relative paths against the first file's directory, so paths here are relative
# to deploy/. `!override` and `!reset` need Compose 2.24.4 or newer.
x-walg-environment: &walg-environment
  WALG_S3_PREFIX: s3://topup-backups/postgres
  AWS_ENDPOINT: http://minio:9000
  AWS_REGION: us-east-1
  AWS_S3_FORCE_PATH_STYLE: "true"
  # A restore phase switches to the read-only topup-restore-read user created by minio-init.
  AWS_ACCESS_KEY_ID: ${TOPUP_LOCAL_S3_ACCESS_KEY_ID:-topup-minio}
  AWS_SECRET_ACCESS_KEY: ${TOPUP_LOCAL_S3_SECRET_ACCESS_KEY:-topup-minio-secret}
  # The attested file reads AWS_SESSION_TOKEN from the shell; a developer's SSO token must never
  # reach MinIO.
  AWS_SESSION_TOKEN: ""

x-service-build: &service-build
  context: ..
  dockerfile: Dockerfile
  args:
    SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}

services:
  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: topup-minio
      MINIO_ROOT_PASSWORD: topup-minio-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 topup-minio topup-minio-secret >/dev/null
        mc mb --ignore-existing local/topup-backups >/dev/null
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::topup-backups"]},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::topup-backups/*"]}]}' >/tmp/restore-read.json
        mc admin policy create local topup-restore-read /tmp/restore-read.json >/dev/null
        mc admin user add local topup-restore-read topup-restore-read-secret >/dev/null
        # attach fails when the policy is already attached, e.g. when minio-init runs again.
        mc admin policy attach local topup-restore-read --user topup-restore-read >/dev/null 2>&1 ||
          mc admin user info local topup-restore-read | grep -q 'PolicyName: *topup-restore-read'
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  dstack-simulator:
    build:
      context: ..
      dockerfile: deploy/local/Dockerfile.dstack-simulator
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:-crypto-topup-dstack-simulator:local}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  mock-product:
    image: python@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    command: ["python3", "/opt/topup/mock-product.py"]
    volumes:
      - ./local/mock-product.py:/opt/topup/mock-product.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  backup-key:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
    depends_on:
      dstack-simulator:
        condition: service_healthy
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres-walg
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment
      POSTGRES_PASSWORD: postgres
      TOPUP_APP_PASSWORD: topup
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      minio-init:
        condition: service_completed_successfully

  migrate:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/topup

  topup:
    build: *service-build
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      # Empty (not unset) models a replacement CVM booting before restore: the service fails closed.
      DATABASE_URL: ${TOPUP_LOCAL_DATABASE_URL-postgres://topup_service:topup@postgres:5432/topup}
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_ADMIN_KID: local-admin/v1
      TOPUP_ADMIN_PUBLIC_KEY: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
      TOPUP_PUBLIC_ORIGIN: http://127.0.0.1:${TOPUP_LOCAL_PORT:-18080}
      TOPUP_RPC_PROVIDER_A_URL: http://127.0.0.1:1
      TOPUP_RPC_PROVIDER_B_URL: http://127.0.0.1:1
    # Routes come from a directory so the sandbox and the restore drill can supply their own.
    volumes: !override
      - dstack_socket:/var/run
      - observability:/run/topup-observability:ro
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    ports: !override
      - "127.0.0.1:${TOPUP_LOCAL_PORT:-18080}:8080"
      - "127.0.0.1:${TOPUP_LOCAL_METRICS_PORT:-19464}:9464"
    healthcheck:
      interval: 10s
      retries: 5
    depends_on:
      dstack-simulator:
        condition: service_healthy

  heartbeat:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      # Empty (not unset) models a replacement CVM booting before restore: the service fails closed.
      DATABASE_URL: ${TOPUP_LOCAL_DATABASE_URL-postgres://topup_service:topup@postgres:5432/topup}

  backup:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment
      PGPASSWORD: postgres
      WALG_RETENTION_FULL: "2"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  restore:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-crypto-topup-postgres-walg:local}
    environment:
      <<: *walg-environment

  restore-check:
    image: ${TOPUP_LOCAL_SERVICE_IMAGE:-crypto-topup-service:local}
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/topup
      DSTACK_SIMULATOR_ENDPOINT: /var/run/dstack.sock
      TOPUP_RPC_PROVIDER_A_URL: http://127.0.0.1:1
      TOPUP_RPC_PROVIDER_B_URL: http://127.0.0.1:1
    volumes: !override
      - dstack_socket:/var/run
      - ${TOPUP_LOCAL_ROUTES_DIR:-./config/routes}:/etc/topup/routes:ro
    configs: !reset []
    depends_on:
      dstack-simulator:
        condition: service_healthy
      mock-product:
        condition: service_healthy

volumes:
  dstack_socket:
  minio_data:
