# CVM rehearsal overlay, applied by deploy/local/cvm-rehearsal.sh after the rendered staging
# compose (deploy/render-compose.sh output with a real route inlined). It replaces only what a
# CVM provides and a workstation does not: the dstack socket (the simulator), object storage
# (s3.compose.yml), and the asset chain (Anvil with Sepolia's chain id). Images, commands,
# settings, inline configs, and healthchecks all come from the rendered file, and the secrets from a
# `.env` shaped like staging.env.example.
#
# Like the restore drill, nothing here bind-mounts a host path (CI's Docker daemon cannot see
# the checkout) and the workload publishes no host port; only Anvil is published, on a loopback
# port the script picks, so the contract scripts can deploy to it. `!override` and `!reset` need
# Compose 2.24.4 or newer.
include:
  - s3.compose.yml

services:
  dstack-simulator:
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:?build the simulator image first}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  anvil:
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }

  keys:
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy

  postgres:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  backup:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  topup:
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
    ports: !reset []
    depends_on:
      dstack-simulator:
        condition: service_healthy
      anvil:
        condition: service_healthy

  # Starts with every boot and, in the service variant, exits at once.
  restore-check:
    volumes: !override
      - dstack_socket:/var/run
      - db_owner:/run/db-owner:ro
      - observability:/run/topup-observability
    depends_on:
      dstack-simulator:
        condition: service_healthy

volumes:
  dstack_socket:
