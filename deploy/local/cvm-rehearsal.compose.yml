# CVM rehearsal overlay, applied by deploy/local/cvm-rehearsal.sh after the rendered staging
# compose (deploy/render-compose.sh output with a real route inlined). It replaces only what a
# CVM provides and a workstation does not: the dstack socket (the simulator), object storage
# (s3.compose.yml), and the asset chains (an Anvil with Sepolia's chain id and one with Base
# Sepolia's, for the committed routes of each). Images, commands,
# settings, inline configs, and healthchecks all come from the rendered file, and the secrets from a
# `.env` shaped like staging.env.example.
#
# The exception is the custom domain: dstack-ingress does not run, because tls-alpn-01 needs the
# public DNS records and Let's Encrypt connecting through the dstack gateway (the upstream
# TESTING.md tests it only on a real CVM), and running it here would register ACME accounts from
# every rehearsal. Clients call topup on the compose network instead, so that is its origin;
# validate-compose.sh checks the ingress definition.
#
# Like the restore drill, nothing here bind-mounts a host path (CI's Docker daemon cannot see
# the checkout) and the workload publishes no host port; only the Anvils are published, on loopback
# ports the script picks, so the contract scripts can deploy to them. `!override` and `!reset` need
# Compose 2.24.4 or newer.
include:
  - s3.compose.yml

services:
  dstack-simulator:
    image: ${TOPUP_LOCAL_DSTACK_IMAGE:?build the simulator image first}
    volumes:
      - dstack_socket:/var/run
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/dstack.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  anvil:
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }

  # Base Sepolia's chain id, an OP-stack one: its routes credit at Anvil's `safe` head.
  anvil-base-sepolia:
    extends: { file: ../sandbox/docker-compose.local.yml, service: anvil }
    command: !override
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "84532"
      - --block-time
      - "1"
      - --slots-in-an-epoch
      - "4"
    ports: !override
      - "127.0.0.1:${REHEARSAL_BASE_SEPOLIA_ANVIL_PORT:-18546}:8545"

  keys:
    volumes: !override
      - dstack_socket:/var/run
      - walg_key:/run/wal-g
      - db_owner:/run/db-owner
      - db_app:/run/db-app
    depends_on:
      dstack-simulator:
        condition: service_healthy

  postgres:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  backup:
    depends_on:
      s3-init:
        condition: service_completed_successfully

  topup:
    environment:
      TOPUP_PUBLIC_ORIGIN: http://topup:8080
      # The reference product listens on a private compose address, which smokescreen refuses
      # by design: the rehearsal delivers directly (deploy/tests/smokescreen.sh tests the proxy).
      TOPUP_WEBHOOK_PROXY: ""
    volumes: !override
      - dstack_socket:/var/run
      - db_app:/run/db-app:ro
      - observability:/run/topup-observability:ro
    depends_on:
      dstack-simulator:
        condition: service_healthy
      anvil:
        condition: service_healthy
      anvil-base-sepolia:
        condition: service_healthy

  # A profile the rehearsal never enables (see the header).
  dstack-ingress:
    profiles: [cvm]

  # Starts with every boot and, in the service variant, exits at once.
  restore-check:
    volumes: !override
      - dstack_socket:/var/run
      - db_owner:/run/db-owner:ro
      - observability:/run/topup-observability
    depends_on:
      dstack-simulator:
        condition: service_healthy

volumes:
  dstack_socket:
