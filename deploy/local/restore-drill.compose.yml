# Restore-drill overlay, applied after the local overlays by deploy/local/compose.sh, in both
# variants; used locally and on CI alike.
#
# The org's self-hosted CI runner is a container that drives the host Docker daemon through its
# socket, so the daemon cannot see the checkout: bind-mounting a workspace path fails with "path
# does not exist". The drill therefore never bind-mounts. It creates these project volumes and
# fills them with `docker cp`, which streams through the API. `!override` (Compose 2.24.4 or
# newer) replaces each service's whole volume list, because the local overlay mounts host paths
# that a named volume cannot shadow. The configuration and PostgreSQL's init script are inline
# configs, which Compose copies into the containers, so they need no volume here.
#
# The drill talks to the stack only through `docker compose exec` and the compose network, so it
# publishes no host ports; concurrent drills and sandbox runs on one host cannot collide.
services:
  topup:
    ports: !reset []

  # WAL-G against the backup prefix, for the drill's own commands (profile `tools`): the object
  # listing, the wrong-key restore, and the write probe. Never part of a CVM's compose.
  restore:
    image: ${TOPUP_LOCAL_POSTGRES_IMAGE:-phala-pay-postgres-walg:local}
    profiles: [tools]
    user: postgres
    entrypoint: ["/bin/sh", "-eu", "-c"]
    environment:
      WALG_S3_PREFIX: s3://topup-backups/postgres
      AWS_ENDPOINT: http://s3:3900
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      # The source's read-write key; the drill switches it to the replacement's read-only key.
      AWS_ACCESS_KEY_ID: ${TOPUP_DRILL_S3_ACCESS_KEY_ID:-topup-s3}
      AWS_SECRET_ACCESS_KEY: ${TOPUP_DRILL_S3_SECRET_ACCESS_KEY:-topup-s3-secret-key}
      WALG_LIBSODIUM_KEY_PATH: /run/wal-g/backup.key
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql
      - walg_key:/run/wal-g:ro
    restart: "no"

  # The drill's shell on the compose network: it calls topup and the product, and derives from the
  # simulator what the service derives (webhook key, client secrets).
  mock-product:
    volumes: !override
      - drill_mock_product:/opt/topup:ro
      - dstack_socket:/run/dstack

  # The merchant (controlled mode, profile `merchant`): the reference product's webhook receiver
  # (deploy/Dockerfile.reference-product) with the account's webhook key pinned, which keeps each
  # verified delivery in its webhook inbox and exports the restore records the operator imports.
  # Its ledger outlives the service's loss, as a merchant's database does.
  product:
    profiles: [merchant]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.reference-product
    image: ${TOPUP_LOCAL_PRODUCT_IMAGE:-phala-pay-reference-product:local}
    environment:
      PRODUCT_API_KEY: ${TOPUP_DRILL_PRODUCT_API_KEY:-}
    configs:
      - source: drill_product_config
        target: /etc/product/config.json
    volumes:
      - drill_product_ledger:/data
    restart: "no"

volumes:
  drill_mock_product:
  drill_product_ledger:

# The product's account, its treasury, and the account's test-mode webhook key (`whpk_…`), which
# the drill sets once the simulator derives it; the driver key signs nothing here. Only the
# webhook receiver is exercised: nothing calls the service or a chain.
configs:
  drill_product_config:
    content: |
      {
        "service_url": "http://topup:8080",
        "account": "${TOPUP_DRILL_ACCOUNT:-acct_00000000000000000000000000000000}",
        "api_key_env": "PRODUCT_API_KEY",
        "webhook_public_keys": ["${TOPUP_DRILL_WEBHOOK_PUBLIC_KEY:-}"],
        "factory": "0x45466D37587E6E46DC35eB96b74ba3D3b1E5b747",
        "implementation": "0x49F2F1F1a25269Ea0C6FF2AB1C7B09dCBE9c5bA9",
        "chains": [
          {
            "chain_id": 11155111,
            "name": "Sepolia",
            "rpc_url": "http://127.0.0.1:1",
            "treasury": "${TOPUP_DRILL_TREASURY:-0x0000000000000000000000000000000000000000}"
          }
        ],
        "listen_host": "0.0.0.0",
        "listen_port": 8089,
        "public_url": "http://product:8089",
        "driver_public_key": "${TOPUP_DRILL_DRIVER_PUBLIC_KEY:-}",
        "ledger_path": "/data/ledger.sqlite3"
      }
