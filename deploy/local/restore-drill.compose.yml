# Restore-drill overlay, applied after deploy/docker-compose.yml and deploy/local/docker-compose.yml;
# used locally and on CI alike.
#
# The org's self-hosted CI runner is a container that drives the host Docker daemon through its
# socket, so the daemon cannot see the checkout: bind-mounting a workspace path fails with "path
# does not exist". The drill therefore never bind-mounts. It creates these project volumes and
# fills them with `docker cp`, which streams through the API. `!override` (Compose 2.24.4 or
# newer) replaces each service's whole volume list, because the local overlay mounts host paths
# that a named volume cannot shadow. PostgreSQL's init script is an inline config, which Compose
# copies into the container, so it needs no volume here.
#
# The drill talks to the stack only through `docker compose exec` and the compose network, so it
# publishes no host ports; concurrent drills and sandbox runs on one host cannot collide.
services:
  topup:
    volumes: !override
      - dstack_socket:/var/run
      - observability:/run/topup-observability:ro
      - drill_routes:/etc/topup/routes:ro
    ports: !reset []

  mock-product:
    volumes: !override
      - drill_mock_product:/opt/topup:ro

  restore-check:
    volumes: !override
      - dstack_socket:/var/run
      - drill_routes:/etc/topup/routes:ro

volumes:
  drill_routes:
  drill_mock_product:
