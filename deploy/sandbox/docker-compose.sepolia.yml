# Sepolia sandbox overlay for deploy/docker-compose.yml. Never deploy this file directly: run
# render-sepolia-compose.sh, which inlines the rendered sandbox route so the route is part of
# the attested compose, exactly like the staging route.
services:
  topup:
    command:
      - topup
      - run
      - --bind
      - 0.0.0.0:8080
      - --route
      - /etc/topup/routes/sandbox.yaml
    configs:
      - source: topup_route_sandbox
        target: /etc/topup/routes/sandbox.yaml

configs:
  topup_route_sandbox:
    content: "replaced by render-sepolia-compose.sh"
