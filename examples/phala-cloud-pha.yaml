# First route. Ships inside the dstack compose, so every value is part of the attested
# measurement (docs/architecture.md §14). Changing a value is a new version and a new approved
# compose hash. Every value not written here is a code default, as attested as the file (the
# image digest is in the compose hash); `topup route show` prints the resolved route. Numbers are
# illustrative; finance and risk set the real ones.
route: phala-cloud-ethereum-pha-usd
version: 1
product: phala-cloud               # signs with key id phala-cloud/v1

chain:
  chain_id: 1                      # default sanctions oracle: Chainalysis 0x40C5…aC8fb
  forwarder_factory: "0x0000000000000000000000000000000000000000" # set to the deployed factory; the implementation is its first CREATE
  treasury:          "0x0000000000000000000000000000000000000000" # set to the finance Safe at deployment

asset:
  symbol: pha                      # the API's asset code
  contract: "0x6c5bA91642F10282b576d91922Ae6448C9d52f4E"
  decimals: 18

pricing:
  primary: { source: coinmetrics, asset: pha }
  check:   { source: binance, symbol: PHAUSDT } # FX leg: Kraken USDT/USD

limits:
  min_credit_minor: 100                              # USD 1.00; smaller deposits are rejected below_minimum
  max_deposit_atomic: "200000000000000000000000"     # 200,000 PHA (pilot bound; product enforces its own caps too)
  min_refund_atomic: "20000000000000000000"          # 20 PHA refundable dust floor
  max_open_minor: { account: 500000, product: 5000000, global: 10000000 }
