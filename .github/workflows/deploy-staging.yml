name: Deploy staging

# Provisions or upgrades the staging CVM on Phala Cloud (deploy/README.md, "First staging deploy
# checklist"). Nothing staging is deployed from a laptop.
#
# Controls: only a user with write access can dispatch this workflow; the job runs only from
# `main`, and the GitHub Environment `staging` (deployment branches: `main` only) holds its only
# secret, PHALA_CLOUD_API_KEY. Runtime secrets never enter GitHub: `provision` sends the env file
# built from Environment variables with the owner-sealed secrets (S3 keys, Coin Metrics key)
# empty, and the owner then seals the complete env file from their own machine (the run summary
# prints the command); `upgrade` sends no env at all, so the sealed env stays. Required reviewers
# are not available for this private repository's plan, so there is no approval step: dispatching
# is the decision.
#
# Phala Cloud CLI 1.1.22 (checked against Phala-Network/phala-cloud tag cli-v1.1.22):
# - Authentication is the PHALA_CLOUD_API_KEY environment variable, which the CLI prefers over a
#   stored profile; PHALA_CLOUD_DIR points at an empty directory so no profile or API prefix from
#   the runner's home can be read. The API key belongs to the workspace "kingsley's projects".
# - `--kms phala` selects Phala Cloud's KMS (owner decision for staging): no DstackApp contract,
#   no provisioner key, and an update applies directly without an on-chain compose-hash approval.
#   The on-chain Base KMS path in deploy/README.md stays the production path.
# - `deploy --json` writes `Provisioning CVM ...` before the JSON object on a new CVM, and ignores
#   `--wait` there; this workflow waits by polling `cvms get`.
#
# Runner constraints (org self-hosted runner): a container that drives the host Docker daemon
# through its socket, so nothing bind-mounts a workspace path (preflight and the attestation check
# pass files on stdin or parse them client-side); `ss` and `envsubst` are not installed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "provision: create the first CVM; upgrade: update the CVM in vars.STAGING_CVM_ID"
        type: choice
        options: [provision, upgrade]
        required: true
      topup_image:
        description: "crypto-topup image, repository@sha256:<64 hex> (Release images summary)"
        type: string
        required: true
      postgres_walg_image:
        description: "postgres-walg image, repository@sha256:<64 hex> (Release images summary)"
        type: string
        required: true

permissions:
  contents: read

# One deployment at a time; a queued run never cancels one in progress.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: staging
    timeout-minutes: 90
    env:
      MODE: ${{ inputs.mode }}
      TOPUP_IMAGE: ${{ inputs.topup_image }}
      POSTGRES_WALG_IMAGE: ${{ inputs.postgres_walg_image }}
      DSTACK_OS_IMAGE: ${{ vars.DSTACK_OS_IMAGE }}
      STAGING_CVM_ID: ${{ vars.STAGING_CVM_ID }}
      PHALA_WORKSPACE: "kingsley's projects"
      CVM_NAME: crypto-topup-staging
    steps:
      - name: Check inputs and Environment settings
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          status=0
          digest='^[a-z0-9]+([._/-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)*@sha256:[0-9a-f]{64}$'
          for name in TOPUP_IMAGE POSTGRES_WALG_IMAGE; do
            [[ "${!name}" =~ $digest ]] ||
              { echo "::error::$name must be repository@sha256:<64 lowercase hex>"; status=1; }
          done
          [[ -n "$PHALA_CLOUD_API_KEY" ]] ||
            { echo "::error::Environment secret PHALA_CLOUD_API_KEY is not set"; status=1; }
          [[ -n "$DSTACK_OS_IMAGE" ]] ||
            { echo "::error::Environment variable DSTACK_OS_IMAGE is not set"; status=1; }
          case "$MODE" in
            provision)
              [[ -z "$STAGING_CVM_ID" ]] || {
                echo "::error::STAGING_CVM_ID is set ($STAGING_CVM_ID); use mode upgrade, or clear it to provision a new CVM"
                status=1
              } ;;
            upgrade)
              [[ -n "$STAGING_CVM_ID" ]] ||
                { echo "::error::mode upgrade needs the Environment variable STAGING_CVM_ID"; status=1; } ;;
            *) echo "::error::unknown mode $MODE"; status=1 ;;
          esac
          exit "$status"

      - name: Prepare private working files
        run: |
          work="$RUNNER_TEMP/deploy-staging"
          mkdir -p "$work" "$RUNNER_TEMP/phala-cloud"
          env_file=$(umask 077 && mktemp "$RUNNER_TEMP/staging-env.XXXXXX")
          {
            echo "WORK=$work"
            echo "ENV_FILE=$env_file"
            echo "PHALA_CLOUD_DIR=$RUNNER_TEMP/phala-cloud"
          } >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify-deployment.sh (in preflight) builds the contracts.
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      # A new CVM boots with a provisional origin until its gateway URL is known (step "Set the
      # public origin"); an upgrade keeps the existing CVM's gateway URL.
      - name: Resolve the public origin
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == provision ]]; then
            origin=https://pending.invalid
          else
            npx --yes phala@1.1.22 cvms get "$STAGING_CVM_ID" --json >"$WORK/cvm-before.json"
            app_id=$(jq -er '.app_id' "$WORK/cvm-before.json")
            domain=$(jq -er '.gateway.base_domain' "$WORK/cvm-before.json")
            origin="https://${app_id#0x}-8080.$domain"
          fi
          echo "TOPUP_PUBLIC_ORIGIN=$origin" >>"$GITHUB_ENV"
          echo "public origin: $origin"

      # Exactly the names of deploy/staging.env.example, from Environment variables only; the
      # writer leaves the owner-sealed secrets empty. Database credentials are not inputs: the CVM
      # derives them from dstack KMS. `upgrade` writes the file for preflight only and never sends it.
      - name: Write the unsealed env file
        env:
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_FORCE_PATH_STYLE: ${{ vars.AWS_S3_FORCE_PATH_STYLE }}
          TOPUP_ADMIN_KID: ${{ vars.TOPUP_ADMIN_KID }}
          TOPUP_ADMIN_PUBLIC_KEY: ${{ vars.TOPUP_ADMIN_PUBLIC_KEY }}
          TOPUP_BACKUP_KEY_FALLBACK_VERSIONS: ${{ vars.TOPUP_BACKUP_KEY_FALLBACK_VERSIONS }}
          TOPUP_BACKUP_KEY_VERSION: ${{ vars.TOPUP_BACKUP_KEY_VERSION }}
          # TOPUP_PUBLIC_ORIGIN comes from the previous step.
          TOPUP_RPC_PROVIDER_A_URL: ${{ vars.TOPUP_RPC_PROVIDER_A_URL }}
          TOPUP_RPC_PROVIDER_B_URL: ${{ vars.TOPUP_RPC_PROVIDER_B_URL }}
          # Restore-time values (TOPUP_RESTORE_FROM_BACKUP=on, TOPUP_SERVICE_ENABLED=read-only or
          # off) belong only in a restore env (deploy/RESTORE.md); preflight refuses them.
          TOPUP_RESTORE_FROM_BACKUP: "off"
          TOPUP_SERVICE_ENABLED: "on"
          TOPUP_WAL_ARCHIVE: ${{ vars.TOPUP_WAL_ARCHIVE }}
          WALG_S3_PREFIX: ${{ vars.WALG_S3_PREFIX }}
        run: deploy/write-staging-env.sh "$ENV_FILE"

      - name: Render the compose from this commit with the input digests
        run: deploy/render-compose.sh >"$WORK/docker-compose.staging.yml"

      - name: Preflight (read-only; both RPCs, anonymous image pulls, Phala Cloud workspace and OS image)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          deploy/preflight.sh --env "$ENV_FILE" --compose "$WORK/docker-compose.staging.yml" \
            --workspace "$PHALA_WORKSPACE" --os-image "$DSTACK_OS_IMAGE" --kms phala --unsealed

      # The CLI output (JSON, no secrets: the key is only in the environment and env values are
      # encrypted client-side) goes to the log as well, so a failure shows its reason.
      - name: Deploy (${{ inputs.mode }})
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == provision ]]; then
            npx --yes phala@1.1.22 deploy --json \
              --name "$CVM_NAME" \
              --compose "$WORK/docker-compose.staging.yml" \
              -e "$ENV_FILE" \
              --instance-type tdx.medium \
              --fs ext4 \
              --kms phala \
              --image "$DSTACK_OS_IMAGE" \
              --no-dev-os \
              --no-public-logs \
              --no-public-sysinfo \
              --public-tcbinfo \
              --secure-time 2>&1 | tee "$WORK/deploy.raw"
          else
            # No -e: CLI 1.1.22 then sends neither allowed_envs nor encrypted_env in the PATCH
            # (cli/src/commands/deploy/handler.ts: resolveEnvVars returns undefined, and updateCvm
            # sets both fields only for a non-empty list), so the owner-sealed env stays.
            npx --yes phala@1.1.22 deploy --json \
              --cvm-id "$STAGING_CVM_ID" \
              --compose "$WORK/docker-compose.staging.yml" \
              --no-public-logs \
              --no-public-sysinfo \
              --wait 2>&1 | tee "$WORK/deploy.raw"
          fi
          sed -n '/^{/,$p' "$WORK/deploy.raw" >"$WORK/deploy.json"
          jq -e '.success == true' "$WORK/deploy.json" >/dev/null
          cvm_id=$(jq -er '.vm_uuid' "$WORK/deploy.json")
          app_id=$(jq -er '.app_id' "$WORK/deploy.json")
          {
            echo "CVM_ID=$cvm_id"
            echo "APP_ID=$app_id"
          } >>"$GITHUB_ENV"
          {
            echo "## Staging $MODE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CVM id | \`$cvm_id\` |"
            echo "| App id | \`$app_id\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| crypto-topup | \`$TOPUP_IMAGE\` |"
            echo "| postgres-walg | \`$POSTGRES_WALG_IMAGE\` |"
            echo "| OS image | \`$DSTACK_OS_IMAGE\` |"
            echo
            if [[ "$MODE" == provision ]]; then
              # Written now, so a later failure still leaves the id for recovery (mode upgrade).
              echo "Set the \`staging\` Environment variable \`STAGING_CVM_ID\` to \`$cvm_id\`;"
              echo "later runs, including a retry after a failure below, use mode \`upgrade\`."
              echo
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Wait for the CVM and the service
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          settled='.status == "running" and (.in_progress | not)'
          for _ in $(seq 60); do
            npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json" 2>/dev/null &&
              jq -e "$settled" "$WORK/cvm.json" >/dev/null && break
            sleep 15
          done
          jq -e "$settled" "$WORK/cvm.json" >/dev/null ||
            { echo "::error::CVM $CVM_ID is not running"; exit 1; }
          # The hash the attestation must reach (step "Read back and verify the attested compose").
          deployed_hash=$(jq -er '.compose_hash' "$WORK/cvm.json")
          deployed_hash=${deployed_hash#0x}
          echo "DEPLOYED_COMPOSE_HASH=${deployed_hash,,}" >>"$GITHUB_ENV"
          domain=$(jq -er '.gateway.base_domain' "$WORK/cvm.json")
          gateway_origin="https://${APP_ID#0x}-8080.$domain"
          echo "GATEWAY_ORIGIN=$gateway_origin" >>"$GITHUB_ENV"
          for _ in $(seq 60); do
            curl -fsS --max-time 10 "$gateway_origin/healthz" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::$gateway_origin/healthz did not answer"
          exit 1

      # Env values are not part of the app-compose, so the same name set keeps the compose hash;
      # with Phala KMS the update applies directly. Only a new CVM: an upgrade leaves the sealed
      # env, and with it the origin the owner sealed, untouched.
      - name: Set the public origin
        if: inputs.mode == 'provision'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$TOPUP_PUBLIC_ORIGIN" == "$GATEWAY_ORIGIN" ]]; then
            echo "TOPUP_PUBLIC_ORIGIN is already $GATEWAY_ORIGIN"
            exit 0
          fi
          (
            umask 077
            awk -v origin="$GATEWAY_ORIGIN" \
              '/^TOPUP_PUBLIC_ORIGIN=/ { print "TOPUP_PUBLIC_ORIGIN=" origin; next } { print }' \
              "$ENV_FILE" >"$ENV_FILE.new"
          )
          cat "$ENV_FILE.new" >"$ENV_FILE"
          rm -f "$ENV_FILE.new"
          deploy/preflight.sh --env "$ENV_FILE" --compose "$WORK/docker-compose.staging.yml" --offline --unsealed
          before=$(jq -c '.progress' "$WORK/cvm.json")
          # CLI 1.1.22 returns as soon as the API answers `in_progress`; the restart follows.
          npx --yes phala@1.1.22 envs update "$CVM_ID" -e "$ENV_FILE"
          echo "TOPUP_PUBLIC_ORIGIN=$GATEWAY_ORIGIN" >>"$GITHUB_ENV"
          # First see the restart begin (not running, an operation in progress, or a new progress
          # record), within 5 minutes; then wait up to 15 minutes for running and /healthz.
          restarted=0
          for _ in $(seq 60); do
            if npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json" 2>/dev/null &&
              jq -e --argjson before "$before" \
                '.status != "running" or .in_progress or .progress != $before' \
                "$WORK/cvm.json" >/dev/null; then
              restarted=1
              break
            fi
            sleep 5
          done
          ((restarted)) || { echo "::error::the CVM did not start the env update within 5 minutes"; exit 1; }
          for _ in $(seq 60); do
            npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json" 2>/dev/null &&
              jq -e '.status == "running" and (.in_progress | not)' "$WORK/cvm.json" >/dev/null &&
              curl -fsS --max-time 10 "$GATEWAY_ORIGIN/healthz" >/dev/null && exit 0
            sleep 15
          done
          echo "::error::the service did not come back within 15 minutes after the origin update"
          exit 1

      - name: Read back and verify the attested compose
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # After an upgrade the attestation can still describe the previous compose for a while;
          # wait (up to 10 minutes) until it attests the compose hash just deployed.
          attested=""
          for _ in $(seq 40); do
            if npx --yes phala@1.1.22 cvms attestation "$CVM_ID" --json >"$WORK/attestation.json" 2>/dev/null &&
              jq -jer '.compose_file | select(type == "string" and length > 0)' \
                "$WORK/attestation.json" >"$WORK/app-compose.json" 2>/dev/null; then
              attested=$(deploy/compose-hash.sh "$WORK/app-compose.json" 2>/dev/null) || attested=""
              [[ "${attested,,}" == "$DEPLOYED_COMPOSE_HASH" ]] && break
            fi
            sleep 15
          done
          [[ "${attested,,}" == "$DEPLOYED_COMPOSE_HASH" ]] || {
            echo "::error::the attestation reports compose hash '${attested:-none}', not the deployed $DEPLOYED_COMPOSE_HASH"
            exit 1
          }
          npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json"
          deploy/verify-attested-compose.sh "$WORK/attestation.json" "$WORK/cvm.json" \
            "$WORK/docker-compose.staging.yml" 2>&1 | tee "$WORK/verification.txt"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Compose hash | \`0x$DEPLOYED_COMPOSE_HASH\` |"
            echo "| Public origin | $TOPUP_PUBLIC_ORIGIN |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Print the owner's sealing step
        if: inputs.mode == 'provision'
        run: |
          {
            echo "### Owner: seal the runtime secrets"
            echo
            echo "The CVM runs with empty S3 and Coin Metrics keys: the service is up, but WAL"
            echo "archiving and backups fail (TopupBackupTooOld) until the owner seals the complete"
            echo "env file from their own machine. Use exactly the staging.env.example names, the"
            echo "Environment variables' values, TOPUP_PUBLIC_ORIGIN=$GATEWAY_ORIGIN, and the secrets;"
            echo "the same name set keeps the compose hash. From a checkout of \`$GITHUB_SHA\`:"
            echo
            echo '```sh'
            echo "deploy/preflight.sh --env .env.staging --compose docker-compose.staging.yml --offline"
            echo "npx --yes phala@1.1.22 envs update $CVM_ID -e .env.staging"
            echo '```'
            echo
            echo "\`docker-compose.staging.yml\` is in this run's artifact. Backups have started when"
            echo "the WAL key-version marker is younger than two minutes:"
            echo
            echo '```sh'
            # shellcheck disable=SC2016 # printed for the owner's shell, not expanded here
            echo 'aws s3 ls "${WALG_S3_PREFIX%/}/key-versions/current.json" ${AWS_ENDPOINT:+--endpoint-url "$AWS_ENDPOINT"}'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # No secrets: the compose holds only variable references, and the CLI outputs hold ids,
      # hashes, and the attested app-compose.
      - name: Upload the deployment record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/deploy-staging/docker-compose.staging.yml
            ${{ runner.temp }}/deploy-staging/deploy.json
            ${{ runner.temp }}/deploy-staging/cvm.json
            ${{ runner.temp }}/deploy-staging/attestation.json
            ${{ runner.temp }}/deploy-staging/verification.txt

      - name: Delete the env file and CLI state
        if: always()
        run: |
          [[ -z "${ENV_FILE:-}" ]] || rm -f "$ENV_FILE" "$ENV_FILE.new"
          [[ -z "${PHALA_CLOUD_DIR:-}" ]] || rm -rf "$PHALA_CLOUD_DIR"
          [[ -z "${WORK:-}" ]] || rm -rf "$WORK"
