name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One self-hosted runner executes jobs serially; a new push to a PR supersedes its previous run.
# Pushes to main queue instead, so every merge keeps a complete CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Format, clippy with all and with default features, and cargo-deny
        run: make lint
      - name: Runtime binary builds without conformance-only features
        run: |
          cargo check -p topup --locked
          if cargo tree -p topup --locked -e features -i topup-adapters | grep -q 'feature "conformance"'; then
            echo "topup-adapters/conformance must never reach the topup runtime" >&2
            exit 1
          fi

  # The whole workspace once, with PostgreSQL and Foundry. The database and Anvil test helpers fail
  # instead of skipping when CI=true (set by Actions), and CONFORMANCE_REQUIRE_TOOLS=1 does the same
  # for conformance. The dstack simulator test still skips by design: no simulator runs here.
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://topup_ci:topup_ci@localhost:5432/postgres
      CONFORMANCE_REQUIRE_TOOLS: "1"
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/rust
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: cargo run --locked -p topup -- migrate
      - name: Create application login role
        run: >-
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE topup_ci LOGIN PASSWORD 'topup_ci' IN ROLE topup_app"
      - name: Check SQLx offline metadata
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Test the workspace, including conformance variants on Anvil and PostgreSQL
        run: cargo test --workspace --locked --all-features -- --nocapture

  sdk:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Install the locked SDK environment
        run: make -C sdk/python sync
      - name: Lint, type-check, test, and check that client regeneration is a no-op
        run: make -C sdk/python check
      - name: Check sandbox scripts
        run: for file in deploy/sandbox/*.sh; do bash -n "$file"; done

  image:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: >-
          docker build
          --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          --tag crypto-topup-service:ci .
      - name: Smoke test runtime image
        run: docker run --rm crypto-topup-service:ci topup --help
      - name: Validate the sandbox route template
        run: |
          route="$RUNNER_TEMP/sandbox-route.yaml"
          FORWARDER_FACTORY=0x0000000000000000000000000000000000000000 \
          IMPLEMENTATION=0x0000000000000000000000000000000000000000 \
          TREASURY=0x0000000000000000000000000000000000000000 \
          TEST_TOKEN=0x1111111111111111111111111111111111111111 \
          SANCTIONS_ORACLE=0x2222222222222222222222222222222222222222 \
          PRODUCT_SLUG=ci-check PRODUCT_KID=ci-check/v1 \
          SETTLEMENT_URL=https://product.invalid/settlements \
            deploy/sandbox/render-route.sh >"$route"
          docker run --rm -i crypto-topup-service:ci \
            topup route validate --template /dev/stdin <"$route"

  deployment:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the attested compose and the local, sandbox, and restore-drill overlays
        run: deploy/validate-compose.sh
      - name: Validate Prometheus rules and alert behavior
        run: deploy/check-alerts.sh
      - name: Validate deployment scripts and app compose
        run: |
          for file in deploy/*.sh deploy/contracts/*.sh deploy/local/*.sh deploy/scripts/* deploy/postgres-init/* deploy/tests/*.sh; do
            case "$(head -n 1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          jq empty deploy/app-compose.example.json
          deploy/tests/walg-cron.sh
          deploy/tests/walg-restore.sh
          deploy/tests/render-compose.sh
          deploy/tests/render-route.sh
          deploy/tests/preflight.sh
          deploy/tests/write-staging-env.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile deploy/local/mock-product.py
          TOPUP_IMAGE=ghcr.io/phala-network/crypto-topup@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
          POSTGRES_WALG_IMAGE=ghcr.io/phala-network/postgres-walg@sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            deploy/render-app-compose.sh deploy/staging.env.example | jq -e \
              '.docker_compose_file | contains("@sha256:1111111111111111111111111111111111111111111111111111111111111111")' \
              >/dev/null
      - uses: ./.github/actions/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-runbooks-${{ hashFiles('**/Cargo.lock') }}
      - name: Check runbook commands against the CLI and OpenAPI
        run: make runbook-check
      - name: Build postgres-walg image
        run: docker build -f deploy/Dockerfile.postgres-walg -t postgres-walg:ci .
      - name: Check WAL-G runtime
        run: docker run --rm postgres-walg:ci wal-g --version
      - name: postgres-walg carries TLS roots for the object store
        run: docker run --rm --entrypoint sh postgres-walg:ci -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - name: Check the WAL archive switch
        run: deploy/tests/walg-archive-switch.sh postgres-walg:ci

  contracts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Check formatting
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge fmt --check
      - name: Build contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge build
      - name: Test contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge test
      - name: Check deterministic deployment
        run: |
          deploy/contracts/check-build.sh --check
          deploy/contracts/test-determinism.sh
