name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One self-hosted runner executes jobs serially; a new push to a PR supersedes its previous run.
# Pushes to main queue instead, so every merge keeps a complete CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  fmt:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check

  clippy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings
      - name: Runtime binary builds without conformance-only features
        run: |
          cargo check -p topup --locked
          if cargo tree -p topup --locked -e features -i topup-adapters | grep -q 'feature "conformance"'; then
            echo "topup-adapters/conformance must never reach the topup runtime" >&2
            exit 1
          fi

  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace --locked --all-features

  conformance:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CONFORMANCE_REQUIRE_TOOLS: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('**/Cargo.lock') }}
      - name: Prove conforming and broken reference variants on Anvil and PostgreSQL
        run: cargo test -p topup-conformance --locked --all-features -- --nocapture

  db:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://topup_ci:topup_ci@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-db-${{ hashFiles('**/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: cargo run --locked -p topup -- migrate
      - name: Create application login role
        run: >-
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE topup_ci LOGIN PASSWORD 'topup_ci' IN ROLE topup_app"
      - name: Check SQLx offline metadata
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx prepare --workspace --check -- --all-targets --all-features
      - name: Run PostgreSQL integration tests
        run: >-
          cargo test --locked -p topup --all-features
          --tests -- --nocapture

  sdk:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
      - name: Install the locked SDK environment
        run: make -C sdk/python sync
      - name: Lint, type-check, test, and check that client regeneration is a no-op
        run: make -C sdk/python check
      - name: Check sandbox scripts
        run: |
          for file in deploy/sandbox/*.sh; do bash -n "$file"; done
          docker compose -f deploy/local/docker-compose.yml \
            -f deploy/sandbox/docker-compose.local.yml config >/dev/null

  deny:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  image:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: >-
          docker build
          --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          --tag crypto-topup-service:ci .
      - name: Smoke test runtime image
        run: docker run --rm crypto-topup-service:ci topup --help
      - name: Validate the sandbox route template
        run: |
          route="$RUNNER_TEMP/sandbox-route.yaml"
          FORWARDER_FACTORY=0x0000000000000000000000000000000000000000 \
          IMPLEMENTATION=0x0000000000000000000000000000000000000000 \
          TREASURY=0x0000000000000000000000000000000000000000 \
          TEST_TOKEN=0x1111111111111111111111111111111111111111 \
          SANCTIONS_ORACLE=0x2222222222222222222222222222222222222222 \
          PRODUCT_SLUG=ci-check PRODUCT_KID=ci-check/v1 \
          SETTLEMENT_URL=https://product.invalid/settlements \
            deploy/sandbox/render-route.sh >"$route"
          docker run --rm -i crypto-topup-service:ci \
            topup route validate --template /dev/stdin <"$route"

  deployment:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose files
        run: |
          deploy/validate-compose.sh
          docker compose -f deploy/local/docker-compose.yml config >/dev/null
          docker compose -f deploy/local/docker-compose.yml \
            -f deploy/local/restore-drill.compose.yml config >/dev/null
      - name: Validate Prometheus rules and alert behavior
        run: deploy/check-alerts.sh
      - name: Validate deployment scripts and app compose
        run: |
          for file in deploy/*.sh deploy/contracts/*.sh deploy/local/*.sh deploy/scripts/* deploy/postgres-init/* deploy/tests/*.sh; do
            case "$(head -n 1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          jq empty deploy/app-compose.example.json
          deploy/tests/walg-cron.sh
          deploy/tests/walg-restore.sh
          deploy/tests/render-compose.sh
          deploy/tests/render-route.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile deploy/local/mock-product.py
          TOPUP_IMAGE=ghcr.io/phala-network/crypto-topup@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
          POSTGRES_WALG_IMAGE=ghcr.io/phala-network/postgres-walg@sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            deploy/render-app-compose.sh deploy/staging.env.example | jq -e \
              '.docker_compose_file | contains("@sha256:1111111111111111111111111111111111111111111111111111111111111111")' \
              >/dev/null
      - name: Ensure Rust toolchain (self-hosted runners may lack rustup)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-runbooks-${{ hashFiles('**/Cargo.lock') }}
      - name: Check runbook commands against the CLI and OpenAPI
        run: make runbook-check
      - name: Build postgres-walg image
        run: docker build -f deploy/Dockerfile.postgres-walg -t postgres-walg:ci .
      - name: Check WAL-G runtime
        run: docker run --rm postgres-walg:ci wal-g --version
      - name: Check the WAL archive switch
        run: deploy/tests/walg-archive-switch.sh postgres-walg:ci

  contracts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Foundry
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - name: Check formatting
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge fmt --check
      - name: Build contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge build
      - name: Test contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge test
      - name: Check deterministic deployment
        run: |
          deploy/contracts/check-build.sh --check
          deploy/contracts/test-determinism.sh
