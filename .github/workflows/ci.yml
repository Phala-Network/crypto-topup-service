name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace --locked

  db:
    runs-on: ubuntu-latest
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://topup_ci:topup_ci@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-db-${{ hashFiles('**/Cargo.lock') }}
      - name: Install SQLx CLI
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
      - name: Run migrations
        run: cargo run --locked -p topup -- migrate
      - name: Create application login role
        run: >-
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE topup_ci LOGIN PASSWORD 'topup_ci' IN ROLE topup_app"
      - name: Check SQLx offline metadata
        env:
          SQLX_OFFLINE: false
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: Run PostgreSQL integration tests
        run: cargo test --locked -p topup --tests -- --nocapture

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: >-
          docker build
          --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          --tag crypto-topup-service:ci .
      - name: Smoke test runtime image
        run: docker run --rm crypto-topup-service:ci topup --help

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose files
        run: |
          deploy/validate-compose.sh
          docker compose -f deploy/local/docker-compose.yml config >/dev/null
      - name: Validate deployment scripts and app compose
        run: |
          for file in deploy/*.sh deploy/local/*.sh deploy/scripts/* deploy/postgres-init/* deploy/tests/*.sh; do
            case "$(head -n 1 "$file")" in
              *bash) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          jq empty deploy/app-compose.example.json
          deploy/tests/walg-cron.sh
          deploy/tests/render-compose.sh
          TOPUP_IMAGE=ghcr.io/phala-network/crypto-topup@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
          POSTGRES_WALG_IMAGE=ghcr.io/phala-network/postgres-walg@sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            deploy/render-app-compose.sh deploy/staging.env.example | jq -e \
              '.docker_compose_file | contains("@sha256:1111111111111111111111111111111111111111111111111111111111111111")' \
              >/dev/null
      - name: Build postgres-walg image
        run: docker build -f deploy/Dockerfile.postgres-walg -t postgres-walg:ci .
      - name: Check WAL-G runtime
        run: docker run --rm postgres-walg:ci wal-g --version

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Foundry
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - name: Check formatting
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge fmt --check
      - name: Build contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge build
      - name: Test contracts
        if: ${{ hashFiles('contracts/foundry.toml') != '' }}
        working-directory: contracts
        run: forge test
