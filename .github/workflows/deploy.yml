name: Deploy

# Provisions or upgrades the topup CVM of one GitHub Environment, `staging` or `production`, on
# Phala Cloud (deploy/README.md, "Deploy"). Nothing is deployed from a laptop.
#
# Controls: only a user with write access can dispatch this workflow; the job runs only from
# `main`, in the Environment chosen by the input (deployment branches: `main` only), whose only
# secret is PHALA_CLOUD_API_KEY. `production` also has required reviewers, and the job refuses to
# run in it unless the Environment has that rule. The images are those of a successful Release
# images run on `main`, read from its `images.json` artifact, never typed in. The CVM's env holds
# only the owner-sealed secrets (deploy/staging.env.example), which never enter GitHub:
# `provision` sends them empty, and the owner then seals them from their own machine (the run
# summary prints the command); `upgrade` sends no env at all, so the sealed env stays. Every other
# setting is public and attested: deploy/render-compose.sh renders the Environment variables below
# into the compose, so a changed value is a new compose hash and takes effect only through
# `upgrade` (deploy/README.md, "Attested settings").
#
# Phala Cloud CLI 1.1.22 (checked against Phala-Network/phala-cloud tag cli-v1.1.22):
# - Authentication is the PHALA_CLOUD_API_KEY environment variable, which the CLI prefers over a
#   stored profile; PHALA_CLOUD_DIR points at an empty directory so no profile or API prefix from
#   the runner's home can be read. The API key belongs to the workspace in vars.PHALA_WORKSPACE.
# - `--kms phala` selects Phala Cloud's KMS for every CVM (owner decision, deploy/README.md "KMS"):
#   no DstackApp contract, no provisioner key, and an update applies directly.
# - `deploy --json` writes `Provisioning CVM ...` before the JSON object on a new CVM, and ignores
#   `--wait` there; this workflow waits by polling `cvms get`.
#
# Runner constraints (org self-hosted runner): a container that drives the host Docker daemon
# through its socket, so nothing bind-mounts a workspace path (preflight and the dstack verifier
# take their input on stdin, or files are parsed client-side); `ss` and `envsubst` are not installed.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      mode:
        description: "provision: create the first CVM; upgrade: update the CVM in vars.TOPUP_CVM_ID"
        type: choice
        options: [provision, upgrade]
        required: true
      release_run_id:
        description: "Run id of a successful Release images run on main (its images are deployed)"
        type: string
        required: true

# actions: read downloads the Release images artifact and reads the Environment's protection rules.
permissions:
  actions: read
  contents: read

# One deployment per Environment at a time; a queued run never cancels one in progress.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      MODE: ${{ inputs.mode }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      DSTACK_OS_IMAGE: ${{ vars.DSTACK_OS_IMAGE }}
      TOPUP_CVM_ID: ${{ vars.TOPUP_CVM_ID }}
      PHALA_WORKSPACE: ${{ vars.PHALA_WORKSPACE }}
      CVM_NAME: crypto-topup-${{ inputs.environment }}
      # The attested settings (deploy/README.md, "Attested settings"); TOPUP_PUBLIC_ORIGIN comes
      # from step "Resolve the public origin". The RPC URLs are published with the compose, so
      # they must be keyless public URLs.
      AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_FORCE_PATH_STYLE: ${{ vars.AWS_S3_FORCE_PATH_STYLE }}
      WALG_S3_PREFIX: ${{ vars.WALG_S3_PREFIX }}
      TOPUP_ADMIN_KID: ${{ vars.TOPUP_ADMIN_KID }}
      TOPUP_ADMIN_PUBLIC_KEY: ${{ vars.TOPUP_ADMIN_PUBLIC_KEY }}
      TOPUP_BACKUP_KEY_VERSION: ${{ vars.TOPUP_BACKUP_KEY_VERSION }}
      TOPUP_BACKUP_KEY_FALLBACK_VERSIONS: ${{ vars.TOPUP_BACKUP_KEY_FALLBACK_VERSIONS }}
      TOPUP_RPC_PROVIDER_A_URL: ${{ vars.TOPUP_RPC_PROVIDER_A_URL }}
      TOPUP_RPC_PROVIDER_B_URL: ${{ vars.TOPUP_RPC_PROVIDER_B_URL }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
    steps:
      - name: Check inputs and Environment settings
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          [[ -n "$PHALA_CLOUD_API_KEY" ]] ||
            { echo "::error::Environment secret PHALA_CLOUD_API_KEY is not set"; status=1; }
          for name in PHALA_WORKSPACE DSTACK_OS_IMAGE SENTRY_ENVIRONMENT AWS_ENDPOINT AWS_REGION \
            AWS_S3_FORCE_PATH_STYLE WALG_S3_PREFIX TOPUP_ADMIN_KID TOPUP_ADMIN_PUBLIC_KEY \
            TOPUP_BACKUP_KEY_VERSION TOPUP_BACKUP_KEY_FALLBACK_VERSIONS TOPUP_RPC_PROVIDER_A_URL \
            TOPUP_RPC_PROVIDER_B_URL; do
            [[ -n "${!name}" ]] ||
              { echo "::error::Environment variable $name is not set"; status=1; }
          done
          [[ "$SENTRY_ENVIRONMENT" == "$DEPLOY_ENVIRONMENT" ]] ||
            { echo "::error::SENTRY_ENVIRONMENT must be $DEPLOY_ENVIRONMENT"; status=1; }
          case "$MODE" in
            provision)
              [[ -z "$TOPUP_CVM_ID" ]] || {
                echo "::error::TOPUP_CVM_ID is set ($TOPUP_CVM_ID); use mode upgrade, or clear it to provision a new CVM"
                status=1
              } ;;
            upgrade)
              [[ -n "$TOPUP_CVM_ID" ]] ||
                { echo "::error::mode upgrade needs the Environment variable TOPUP_CVM_ID"; status=1; } ;;
            *) echo "::error::unknown mode $MODE"; status=1 ;;
          esac
          api() {
            curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"
          }
          # Production is gated by its reviewers; refuse to deploy if the rule was removed.
          if [[ "$DEPLOY_ENVIRONMENT" == production ]] &&
            ! api environments/production |
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers")' >/dev/null; then
            echo "::error::the production Environment has no required reviewers"
            status=1
          fi
          # Only images a successful Release images run published from main.
          if [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] && release=$(api "actions/runs/$RELEASE_RUN_ID") &&
            jq -e '(.path | split("@")[0]) == ".github/workflows/release-images.yml"
              and .head_branch == "main" and .event == "workflow_dispatch"
              and .conclusion == "success"' <<<"$release" >/dev/null; then
            echo "RELEASE_SHA=$(jq -er .head_sha <<<"$release")" >>"$GITHUB_ENV"
          else
            echo "::error::release_run_id must be a successful Release images run on main"
            status=1
          fi
          exit "$status"

      - name: Prepare private working files
        run: |
          work="$RUNNER_TEMP/deploy"
          mkdir -p "$work" "$RUNNER_TEMP/phala-cloud"
          env_file=$(umask 077 && mktemp "$RUNNER_TEMP/topup-env.XXXXXX")
          {
            echo "WORK=$work"
            echo "ENV_FILE=$env_file"
            echo "PHALA_CLOUD_DIR=$RUNNER_TEMP/phala-cloud"
            echo "COMPOSE=$work/docker-compose.$DEPLOY_ENVIRONMENT.yml"
          } >>"$GITHUB_ENV"

      - name: Download the release's images.json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          merge-multiple: true
          path: ${{ runner.temp }}/deploy/release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Take the images from the release
        run: |
          digest='^[a-z0-9]+([._/-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)*@sha256:[0-9a-f]{64}$'
          for name in TOPUP_IMAGE POSTGRES_WALG_IMAGE; do
            ref=$(jq -er --arg name "$name" '.[$name]' "$WORK/release/images.json")
            [[ "$ref" =~ $digest ]] ||
              { echo "::error::$name of the release is not repository@sha256:<64 lowercase hex>"; exit 1; }
            echo "$name=$ref" >>"$GITHUB_ENV"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify-deployment.sh (in preflight) builds the contracts.
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      # A new CVM is rendered with a provisional origin until its gateway URL is known (step "Set
      # the public origin"); an upgrade renders the existing CVM's gateway URL.
      - name: Resolve the public origin
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == provision ]]; then
            origin=https://pending.invalid
          else
            npx --yes phala@1.1.22 cvms get "$TOPUP_CVM_ID" --json >"$WORK/cvm-before.json"
            app_id=$(jq -er '.app_id' "$WORK/cvm-before.json")
            domain=$(jq -er '.gateway.base_domain' "$WORK/cvm-before.json")
            origin="https://${app_id#0x}-8080.$domain"
          fi
          echo "TOPUP_PUBLIC_ORIGIN=$origin" >>"$GITHUB_ENV"
          echo "public origin: $origin"

      # Exactly the names of deploy/staging.env.example, all empty: the owner-sealed secrets.
      # Database credentials are not inputs: the CVM derives them from dstack KMS. `upgrade` writes
      # the file for preflight only and never sends it.
      - name: Write the unsealed env file
        run: deploy/write-staging-env.sh "$ENV_FILE"

      - name: Render the compose from this commit with the release's digests and the settings
        run: |
          deploy/render-compose.sh >"$COMPOSE"
          # Production serves only an Ethereum mainnet route, never the Sepolia staging route.
          chains=$(grep -Eo '^[[:space:]]+chain_id: [0-9]+' "$COMPOSE" | awk '{print $2}' | sort -u | tr '\n' ' ')
          [[ "$DEPLOY_ENVIRONMENT" != production || "$chains" == "1 " ]] ||
            { echo "::error::production needs a compose whose routes are all on chain 1, not: $chains"; exit 1; }

      - name: Preflight (read-only; both RPCs, anonymous image pulls, Phala Cloud workspace and OS image)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          deploy/preflight.sh --env "$ENV_FILE" --compose "$COMPOSE" \
            --workspace "$PHALA_WORKSPACE" --os-image "$DSTACK_OS_IMAGE" --unsealed

      # The CLI output (JSON, no secrets: the key is only in the environment and env values are
      # encrypted client-side) goes to the log as well, so a failure shows its reason.
      - name: Deploy (${{ inputs.mode }})
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == provision ]]; then
            npx --yes phala@1.1.22 deploy --json \
              --name "$CVM_NAME" \
              --compose "$COMPOSE" \
              -e "$ENV_FILE" \
              --instance-type tdx.medium \
              --fs ext4 \
              --kms phala \
              --image "$DSTACK_OS_IMAGE" \
              --no-dev-os \
              --no-public-logs \
              --no-public-sysinfo \
              --public-tcbinfo \
              --secure-time 2>&1 | tee "$WORK/deploy.raw"
          else
            # No -e: CLI 1.1.22 then sends neither allowed_envs nor encrypted_env in the PATCH
            # (cli/src/commands/deploy/handler.ts: resolveEnvVars returns undefined, and updateCvm
            # sets both fields only for a non-empty list), so the owner-sealed env stays.
            npx --yes phala@1.1.22 deploy --json \
              --cvm-id "$TOPUP_CVM_ID" \
              --compose "$COMPOSE" \
              --no-public-logs \
              --no-public-sysinfo \
              --wait 2>&1 | tee "$WORK/deploy.raw"
          fi
          sed -n '/^{/,$p' "$WORK/deploy.raw" >"$WORK/deploy.json"
          jq -e '.success == true' "$WORK/deploy.json" >/dev/null
          cvm_id=$(jq -er '.vm_uuid' "$WORK/deploy.json")
          app_id=$(jq -er '.app_id' "$WORK/deploy.json")
          {
            echo "CVM_ID=$cvm_id"
            echo "APP_ID=$app_id"
          } >>"$GITHUB_ENV"
          {
            echo "## $DEPLOY_ENVIRONMENT $MODE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CVM id | \`$cvm_id\` |"
            echo "| App id | \`$app_id\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Release images run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID (\`$RELEASE_SHA\`) |"
            echo "| crypto-topup | \`$TOPUP_IMAGE\` |"
            echo "| postgres-walg | \`$POSTGRES_WALG_IMAGE\` |"
            echo "| OS image | \`$DSTACK_OS_IMAGE\` |"
            echo
            if [[ "$MODE" == provision ]]; then
              # Written now, so a later failure still leaves the id for recovery (mode upgrade).
              echo "Set the \`$DEPLOY_ENVIRONMENT\` Environment variable \`TOPUP_CVM_ID\` to \`$cvm_id\`;"
              echo "later runs, including a retry after a failure below, use mode \`upgrade\`."
              echo
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # A new CVM's PostgreSQL cannot list the backup prefix until the owner seals the storage
      # credentials, so it refuses to initialize and the service is not up yet: only an upgrade
      # waits for /healthz.
      - name: Wait for the CVM and the service
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          settled='.status == "running" and (.in_progress | not)'
          for _ in $(seq 60); do
            npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json" 2>/dev/null &&
              jq -e "$settled" "$WORK/cvm.json" >/dev/null && break
            sleep 15
          done
          jq -e "$settled" "$WORK/cvm.json" >/dev/null ||
            { echo "::error::CVM $CVM_ID is not running"; exit 1; }
          # The hash the attestation must reach (step "Read back and verify the attested compose").
          deployed_hash=$(jq -er '.compose_hash' "$WORK/cvm.json")
          deployed_hash=${deployed_hash#0x}
          echo "DEPLOYED_COMPOSE_HASH=${deployed_hash,,}" >>"$GITHUB_ENV"
          domain=$(jq -er '.gateway.base_domain' "$WORK/cvm.json")
          gateway_origin="https://${APP_ID#0x}-8080.$domain"
          echo "GATEWAY_ORIGIN=$gateway_origin" >>"$GITHUB_ENV"
          [[ "$MODE" == upgrade ]] || exit 0
          for _ in $(seq 60); do
            curl -fsS --max-time 10 "$gateway_origin/healthz" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::$gateway_origin/healthz did not answer"
          exit 1

      # The gateway URL is known only after provisioning, and it is attested configuration: upgrade
      # the new CVM to the compose rendered with it (no -e: the env stays).
      - name: Set the public origin
        if: inputs.mode == 'provision'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          TOPUP_PUBLIC_ORIGIN=$GATEWAY_ORIGIN deploy/render-compose.sh >"$COMPOSE"
          echo "TOPUP_PUBLIC_ORIGIN=$GATEWAY_ORIGIN" >>"$GITHUB_ENV"
          deploy/preflight.sh --env "$ENV_FILE" --compose "$COMPOSE" --offline --unsealed
          npx --yes phala@1.1.22 deploy --json \
            --cvm-id "$CVM_ID" \
            --compose "$COMPOSE" \
            --no-public-logs \
            --no-public-sysinfo \
            --wait 2>&1 | tee "$WORK/deploy-public-origin.raw"
          sed -n '/^{/,$p' "$WORK/deploy-public-origin.raw" >"$WORK/deploy-public-origin.json"
          jq -e '.success == true' "$WORK/deploy-public-origin.json" >/dev/null
          # Wait for the new compose hash and a running CVM.
          for _ in $(seq 60); do
            if npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json" 2>/dev/null &&
              jq -e --arg before "$DEPLOYED_COMPOSE_HASH" \
                '.status == "running" and (.in_progress | not)
                  and ((.compose_hash | ascii_downcase | ltrimstr("0x")) != $before)' \
                "$WORK/cvm.json" >/dev/null; then
              deployed_hash=$(jq -er '.compose_hash' "$WORK/cvm.json")
              deployed_hash=${deployed_hash#0x}
              echo "DEPLOYED_COMPOSE_HASH=${deployed_hash,,}" >>"$GITHUB_ENV"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the CVM did not run the compose with the public origin within 15 minutes"
          exit 1

      - name: Read back and verify the attested compose
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          # After an upgrade the attestation can still describe the previous compose for a while;
          # wait (up to 10 minutes) until it attests the compose hash just deployed.
          attested=""
          for _ in $(seq 40); do
            if npx --yes phala@1.1.22 cvms attestation "$CVM_ID" --json >"$WORK/attestation.json" 2>/dev/null &&
              attested=$(jq -r '[.tcb_info.event_log[]? | select(.event == "compose-hash")
                  | .event_payload][0] // ""' "$WORK/attestation.json" 2>/dev/null); then
              [[ "${attested,,}" == "$DEPLOYED_COMPOSE_HASH" ]] && break
            fi
            sleep 15
          done
          [[ "${attested,,}" == "$DEPLOYED_COMPOSE_HASH" ]] || {
            echo "::error::the attestation reports compose hash '${attested:-none}', not the deployed $DEPLOYED_COMPOSE_HASH"
            exit 1
          }
          npx --yes phala@1.1.22 cvms get "$CVM_ID" --json >"$WORK/cvm.json"
          # The guest agent's public info (port 8090, public tcbinfo) carries the vm_config.
          domain=$(jq -er '.gateway.base_domain' "$WORK/cvm.json")
          curl -fsS --max-time 30 --retry 5 --retry-all-errors \
            "https://${APP_ID#0x}-8090.$domain/prpc/Info" >"$WORK/info.json"
          deploy/verify-attestation.sh "$WORK/attestation.json" "$WORK/info.json" "$APP_ID" \
            "$COMPOSE" 2>&1 | tee "$WORK/verification.txt"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Compose hash | \`0x$DEPLOYED_COMPOSE_HASH\` |"
            echo "| Public origin | $TOPUP_PUBLIC_ORIGIN |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Print the owner's sealing step
        if: inputs.mode == 'provision'
        run: |
          {
            echo "### Owner: seal the runtime secrets"
            echo
            echo "The CVM waits for its storage credentials: PostgreSQL refuses to initialize until"
            echo "it can list the backup prefix, so the service is not up yet. From your own machine,"
            echo "write \`.env.$DEPLOY_ENVIRONMENT\` (mode 0600) with exactly the staging.env.example names:"
            echo "\`AWS_ACCESS_KEY_ID\`, \`AWS_SECRET_ACCESS_KEY\`, and \`SENTRY_DSN\` (may be empty). The"
            echo "same name set keeps the compose hash. From a checkout of \`$GITHUB_SHA\`:"
            echo
            echo '```sh'
            echo "deploy/preflight.sh --env .env.$DEPLOY_ENVIRONMENT --compose docker-compose.$DEPLOY_ENVIRONMENT.yml --offline"
            echo "npx --yes phala@1.1.22 envs update $CVM_ID -e .env.$DEPLOY_ENVIRONMENT"
            echo '```'
            echo
            echo "\`docker-compose.$DEPLOY_ENVIRONMENT.yml\` is in this run's artifact. The service answers"
            echo "$GATEWAY_ORIGIN/healthz once the CVM has restarted with the secrets, and backups have"
            echo "started when the WAL key-version marker is younger than two minutes:"
            echo
            echo '```sh'
            echo "aws s3 ls \"${WALG_S3_PREFIX%/}/key-versions/current.json\" --endpoint-url \"$AWS_ENDPOINT\""
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # No secrets: the compose holds the public settings and references to the sealed secrets,
      # and the CLI outputs hold ids, hashes, and the attested app-compose.
      - name: Upload the deployment record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.environment }}-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/deploy/docker-compose.${{ inputs.environment }}.yml
            ${{ runner.temp }}/deploy/release/images.json
            ${{ runner.temp }}/deploy/deploy.json
            ${{ runner.temp }}/deploy/deploy-public-origin.json
            ${{ runner.temp }}/deploy/cvm.json
            ${{ runner.temp }}/deploy/attestation.json
            ${{ runner.temp }}/deploy/info.json
            ${{ runner.temp }}/deploy/verification.txt

      - name: Delete the env file and CLI state
        if: always()
        run: |
          [[ -z "${ENV_FILE:-}" ]] || rm -f "$ENV_FILE" "$ENV_FILE.new"
          [[ -z "${PHALA_CLOUD_DIR:-}" ]] || rm -rf "$PHALA_CLOUD_DIR"
          [[ -z "${WORK:-}" ]] || rm -rf "$WORK"
