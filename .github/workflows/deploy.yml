name: Deploy

# Provisions or upgrades one CVM on Phala Cloud (deploy/README.md, "Deploy"): target `topup`, the
# service, in the GitHub Environment `staging` or `production`; or target `product`, the staging
# reference product (deploy/README.md, "Staging reference product"), in `staging` only. Nothing is
# deployed from a laptop.
#
# Controls: only a user with write access can dispatch this workflow; the job runs only from
# `main`, in the Environment chosen by the input (deployment branches: `main` only), whose only
# secret is PHALA_CLOUD_API_KEY. There is no approval step (required reviewers are not available
# on this repository's plan): whoever dispatches a run is accountable for it, and the run's
# attested compose and verifier read-back are the audit trail. The images are those of a
# successful Release images run on `main`, read from its `images.json` artifact, never typed in.
# The CVM's env holds only the owner-sealed secrets (deploy/staging.env.example, or
# deploy/product/staging.env.example: the product's signing seed), which never enter GitHub:
# `provision` sends them empty, and the owner then seals them from their own machine (the run
# summary prints the command); `upgrade` sends no env at all, so the sealed env stays. Every other
# setting is public and attested: the target's render-compose.sh renders the Environment variables
# below into the compose, so a changed value is a new compose hash and takes effect only through
# `upgrade` (deploy/README.md, "Attested settings"). topup's public origin is its custom domain,
# https://vars.TOPUP_DOMAIN, served by dstack-ingress in the CVM (deploy/README.md, "Custom domain");
# the summary lists the DNS records the owner creates for it. The product's TOPUP_ORIGIN is that
# origin: it calls topup's API there and, at startup, pins from there the settlement/v1 key that
# verifies topup's webhooks.
#
# Phala Cloud CLI 1.1.22 (checked against Phala-Network/phala-cloud tag cli-v1.1.22), run by
# deploy/phala-cvm.sh:
# - Authentication is the PHALA_CLOUD_API_KEY environment variable, which the CLI prefers over a
#   stored profile; PHALA_CLOUD_DIR points at an empty directory so no profile or API prefix from
#   the runner's home can be read. The API key belongs to the workspace in vars.PHALA_WORKSPACE.
# - `--kms phala` selects Phala Cloud's KMS for every CVM (owner decision, deploy/README.md "KMS"):
#   no DstackApp contract, no provisioner key, and an update applies directly.
# - `deploy --json` ignores `--wait` on a new CVM; this workflow waits by polling `cvms get`.
#
# Runner constraints (org self-hosted runner): a container that drives the host Docker daemon
# through its socket, so nothing bind-mounts a workspace path (preflight and the dstack verifier
# take their input on stdin, or files are parsed client-side); `ss` and `envsubst` are not installed.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      target:
        description: "topup: the service CVM (vars.TOPUP_CVM_ID); product: the staging reference-product CVM (vars.STAGING_PRODUCT_CVM_ID)"
        type: choice
        options: [topup, product]
        required: true
      mode:
        description: "provision: create the target's first CVM; upgrade: update the target's CVM"
        type: choice
        options: [provision, upgrade]
        required: true
      release_run_id:
        description: "Run id of a successful Release images run on main (its images are deployed)"
        type: string
        required: true

# actions: read reads the Release images run and downloads its artifact.
permissions:
  actions: read
  contents: read

# One deployment per CVM at a time; a queued run never cancels one in progress.
concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.target }}
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      # The owner-approved OS image (architecture §14); preflight refuses any other.
      DSTACK_OS_IMAGE: dstack-0.5.9
      TOPUP_CVM_ID: ${{ vars.TOPUP_CVM_ID }}
      STAGING_PRODUCT_CVM_ID: ${{ vars.STAGING_PRODUCT_CVM_ID }}
      PHALA_WORKSPACE: ${{ vars.PHALA_WORKSPACE }}
      # The attested settings (deploy/README.md, "Attested settings"); TOPUP_ORIGIN,
      # PRODUCT_PUBLIC_URL, and TOPUP_GATEWAY_DOMAIN come from step "Resolve the public URLs". The
      # RPC URLs are published with the compose: a keyed provider's URL has `{key}` in place of the
      # key, which the owner seals as TOPUP_RPC_PROVIDER_<A|B>_KEY. SENTRY_ENVIRONMENT is the
      # Environment's name; an unset AWS_REGION, AWS_S3_FORCE_PATH_STYLE, TOPUP_ADMIN_KID, or
      # PRODUCT_RPC_URL is derived in step "Check inputs and Environment settings".
      AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_FORCE_PATH_STYLE: ${{ vars.AWS_S3_FORCE_PATH_STYLE }}
      WALG_S3_PREFIX: ${{ vars.WALG_S3_PREFIX }}
      TOPUP_DOMAIN: ${{ vars.TOPUP_DOMAIN }}
      TOPUP_ADMIN_KID: ${{ vars.TOPUP_ADMIN_KID }}
      TOPUP_ADMIN_PUBLIC_KEY: ${{ vars.TOPUP_ADMIN_PUBLIC_KEY }}
      TOPUP_RPC_PROVIDER_A_URL: ${{ vars.TOPUP_RPC_PROVIDER_A_URL }}
      TOPUP_RPC_PROVIDER_B_URL: ${{ vars.TOPUP_RPC_PROVIDER_B_URL }}
      SENTRY_ENVIRONMENT: ${{ inputs.environment }}
      PRODUCT_RPC_URL: ${{ vars.PRODUCT_RPC_URL }}
      PRODUCT_DRIVER_PUBLIC_KEY: ${{ vars.PRODUCT_DRIVER_PUBLIC_KEY }}
    steps:
      # Fixes the target's files and settings for the later steps: DIR holds its compose,
      # render-compose.sh, preflight.sh, and staging.env.example.
      - name: Check inputs and Environment settings
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          # Derived settings (deploy/README.md, "Environment variables"); a set variable overrides.
          if [[ "$AWS_ENDPOINT" =~ ^https://[0-9a-f]+\.r2\.cloudflarestorage\.com$ ]]; then
            AWS_REGION=${AWS_REGION:-auto} AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-true}
          fi
          TOPUP_ADMIN_KID=${TOPUP_ADMIN_KID:-admin/$DEPLOY_ENVIRONMENT-v1}
          PRODUCT_RPC_URL=${PRODUCT_RPC_URL:-$TOPUP_RPC_PROVIDER_B_URL}
          for name in AWS_REGION AWS_S3_FORCE_PATH_STYLE TOPUP_ADMIN_KID PRODUCT_RPC_URL; do
            echo "$name=${!name}" >>"$GITHUB_ENV"
          done
          [[ -n "$PHALA_CLOUD_API_KEY" ]] ||
            { echo "::error::Environment secret PHALA_CLOUD_API_KEY is not set"; status=1; }
          case "$TARGET" in
            topup)
              required="AWS_ENDPOINT AWS_REGION AWS_S3_FORCE_PATH_STYLE WALG_S3_PREFIX
                TOPUP_DOMAIN TOPUP_ADMIN_KID TOPUP_ADMIN_PUBLIC_KEY
                TOPUP_RPC_PROVIDER_A_URL TOPUP_RPC_PROVIDER_B_URL"
              # The public URL is the custom domain; there is no gateway port to resolve.
              dir=deploy cvm_id_variable=TOPUP_CVM_ID cvm_name=phala-pay-$DEPLOY_ENVIRONMENT
              instance_type=tdx.medium port="" origin_variable=""
              images="TOPUP_IMAGE POSTGRES_WALG_IMAGE" compose_name=docker-compose.$DEPLOY_ENVIRONMENT.yml ;;
            product)
              required="TOPUP_DOMAIN PRODUCT_RPC_URL PRODUCT_DRIVER_PUBLIC_KEY"
              [[ "$DEPLOY_ENVIRONMENT" == staging ]] ||
                { echo "::error::the reference product deploys to staging only"; status=1; }
              dir=deploy/product cvm_id_variable=STAGING_PRODUCT_CVM_ID cvm_name=phala-pay-staging-product
              instance_type=tdx.small port=8089 origin_variable=PRODUCT_PUBLIC_URL
              images=PRODUCT_IMAGE compose_name=docker-compose.product.yml ;;
            *) echo "::error::unknown target $TARGET"; exit 1 ;;
          esac
          for name in PHALA_WORKSPACE $required; do
            [[ -n "${!name}" ]] ||
              { echo "::error::Environment variable $name is not set"; status=1; }
          done
          existing=${!cvm_id_variable}
          {
            echo "DIR=$dir"
            echo "CVM_ID_VARIABLE=$cvm_id_variable"
            echo "EXISTING_CVM_ID=$existing"
            echo "CVM_NAME=$cvm_name"
            echo "INSTANCE_TYPE=$instance_type"
            echo "PORT=$port"
            echo "ORIGIN_VARIABLE=$origin_variable"
            echo "IMAGES=$images"
            echo "COMPOSE_NAME=$compose_name"
          } >>"$GITHUB_ENV"
          case "$MODE" in
            provision)
              [[ -z "$existing" ]] || {
                echo "::error::$cvm_id_variable is set ($existing); use mode upgrade, or clear it to provision a new CVM"
                status=1
              } ;;
            upgrade)
              [[ -n "$existing" ]] ||
                { echo "::error::mode upgrade needs the Environment variable $cvm_id_variable"; status=1; } ;;
            *) echo "::error::unknown mode $MODE"; status=1 ;;
          esac
          api() {
            curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"
          }
          # Only images a successful Release images run published from main.
          if [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] && release=$(api "actions/runs/$RELEASE_RUN_ID") &&
            jq -e '(.path | split("@")[0]) == ".github/workflows/release-images.yml"
              and .head_branch == "main" and .event == "workflow_dispatch"
              and .conclusion == "success"' <<<"$release" >/dev/null; then
            echo "RELEASE_SHA=$(jq -er .head_sha <<<"$release")" >>"$GITHUB_ENV"
          else
            echo "::error::release_run_id must be a successful Release images run on main"
            status=1
          fi
          exit "$status"

      - name: Prepare private working files
        run: |
          work="$RUNNER_TEMP/deploy"
          mkdir -p "$work" "$RUNNER_TEMP/phala-cloud"
          env_file=$(umask 077 && mktemp "$RUNNER_TEMP/deploy-env.XXXXXX")
          {
            echo "WORK=$work"
            echo "ENV_FILE=$env_file"
            echo "PHALA_CLOUD_DIR=$RUNNER_TEMP/phala-cloud"
            echo "COMPOSE=$work/$COMPOSE_NAME"
          } >>"$GITHUB_ENV"

      - name: Download the release's images.json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: images-*
          merge-multiple: true
          path: ${{ runner.temp }}/deploy/release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Take the target's images from the release
        run: |
          digest='^[a-z0-9]+([._/-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)*@sha256:[0-9a-f]{64}$'
          for name in $IMAGES; do
            ref=$(jq -er --arg name "$name" '.[$name]' "$WORK/release/images.json")
            [[ "$ref" =~ $digest ]] ||
              { echo "::error::$name of the release is not repository@sha256:<64 lowercase hex>"; exit 1; }
            echo "$name=$ref" >>"$GITHUB_ENV"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify-deployment.sh (in topup's preflight) builds the contracts.
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      # topup's public URL is its custom domain, whose CNAME target is the gateway of the CVM's node.
      # The product's own URL is its gateway URL. Both come from the existing CVM on an upgrade; a
      # new CVM is rendered with a provisional value until its node is known (step "Set the values
      # known only after provisioning"). The product also renders topup's origin, the same
      # Environment's domain.
      - name: Resolve the public URLs
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == upgrade ]]; then
            deploy/phala-cvm.sh get "$EXISTING_CVM_ID" >"$WORK/cvm-before.json"
          fi
          if [[ "$TARGET" == topup ]]; then
            if [[ "$MODE" == provision ]]; then
              gateway=gateway.pending.invalid
            else
              gateway=$(deploy/phala-cvm.sh gateway-domain "$WORK/cvm-before.json")
            fi
            echo "TOPUP_GATEWAY_DOMAIN=$gateway" | tee -a "$GITHUB_ENV"
            echo "PUBLIC_URL=https://$TOPUP_DOMAIN" | tee -a "$GITHUB_ENV"
          else
            if [[ "$MODE" == provision ]]; then
              url=https://pending.invalid
            else
              url=$(deploy/phala-cvm.sh url "$WORK/cvm-before.json" "$PORT")
            fi
            echo "$ORIGIN_VARIABLE=$url" | tee -a "$GITHUB_ENV"
            echo "TOPUP_ORIGIN=https://$TOPUP_DOMAIN" | tee -a "$GITHUB_ENV"
          fi

      # Exactly the names of the target's staging.env.example, all empty: the owner-sealed secrets.
      # Database credentials are not inputs: the CVM derives them from dstack KMS. `upgrade` writes
      # the file for preflight only and never sends it.
      - name: Write the unsealed env file
        run: |
          if [[ "$TARGET" == product ]]; then
            deploy/write-staging-env.sh --product "$ENV_FILE"
          else
            deploy/write-staging-env.sh "$ENV_FILE"
          fi

      - name: Render the compose from this commit with the release's digests and the settings
        run: |
          "$DIR/render-compose.sh" >"$COMPOSE"
          # Production serves only an Ethereum mainnet route, never the Sepolia staging route. Only
          # topup reaches production (the product target is staging-only) and only its compose
          # carries routes.
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            chains=$(grep -Eo '^[[:space:]]+chain_id: [0-9]+' "$COMPOSE" | awk '{print $2}' | sort -u | tr '\n' ' ')
            [[ "$chains" == "1 " ]] ||
              { echo "::error::production needs a compose whose routes are all on chain 1, not: $chains"; exit 1; }
          fi

      # topup: both RPCs, the contracts, anonymous image pulls. product: its RPC's finality against
      # topup's providers, topup's attestation, anonymous pull. Both: the Phala Cloud workspace and
      # OS image.
      - name: Preflight (read-only)
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          "$DIR/preflight.sh" --env "$ENV_FILE" --compose "$COMPOSE" \
            --workspace "$PHALA_WORKSPACE" --os-image "$DSTACK_OS_IMAGE" --unsealed

      # The CLI output (JSON, no secrets: the key is only in the environment and env values are
      # encrypted client-side) goes to the log as well, so a failure shows its reason.
      - name: Deploy (${{ inputs.mode }}) and wait for the CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$MODE" == provision ]]; then
            deploy/phala-cvm.sh deploy "$WORK/deploy.json" \
              --name "$CVM_NAME" \
              --compose "$COMPOSE" \
              -e "$ENV_FILE" \
              --instance-type "$INSTANCE_TYPE" \
              --fs ext4 \
              --kms phala \
              --image "$DSTACK_OS_IMAGE" \
              --no-dev-os \
              --no-public-logs \
              --no-public-sysinfo \
              --public-tcbinfo \
              --secure-time
          else
            # No -e: CLI 1.1.22 then sends neither allowed_envs nor encrypted_env in the PATCH
            # (cli/src/commands/deploy/handler.ts: resolveEnvVars returns undefined, and updateCvm
            # sets both fields only for a non-empty list), so the owner-sealed env stays.
            deploy/phala-cvm.sh deploy "$WORK/deploy.json" \
              --cvm-id "$EXISTING_CVM_ID" \
              --compose "$COMPOSE" \
              --no-public-logs \
              --no-public-sysinfo \
              --wait
          fi
          cvm_id=$(jq -er '.vm_uuid' "$WORK/deploy.json")
          app_id=$(jq -er '.app_id' "$WORK/deploy.json")
          {
            echo "CVM_ID=$cvm_id"
            echo "APP_ID=$app_id"
          } >>"$GITHUB_ENV"
          {
            echo "## $DEPLOY_ENVIRONMENT $TARGET $MODE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| CVM id | \`$cvm_id\` |"
            echo "| App id | \`$app_id\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Release images run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID (\`$RELEASE_SHA\`) |"
            for name in $IMAGES; do
              echo "| $name | \`${!name}\` |"
            done
            echo "| OS image | \`$DSTACK_OS_IMAGE\` |"
            [[ -z "${TOPUP_ORIGIN:-}" ]] || echo "| topup origin | $TOPUP_ORIGIN |"
            echo
            if [[ "$MODE" == provision ]]; then
              # Written now, so a later failure still leaves the id for recovery (mode upgrade).
              echo "Set the \`$DEPLOY_ENVIRONMENT\` Environment variable \`$CVM_ID_VARIABLE\` to \`$cvm_id\`;"
              echo "later runs, including a retry after a failure below, use mode \`upgrade\`."
              echo
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          deploy/phala-cvm.sh wait "$cvm_id" >"$WORK/cvm.json"
          if [[ "$TARGET" == product ]]; then
            echo "PUBLIC_URL=$(deploy/phala-cvm.sh url "$WORK/cvm.json" "$PORT")" | tee -a "$GITHUB_ENV"
          fi

      # A new CVM lands on a node chosen by Phala Cloud. Its gateway (topup's CNAME target, which
      # dstack-ingress names) and the product's gateway URL are known only now, and both are attested
      # configuration: upgrade the new CVM to the compose rendered with them (no -e: the env stays).
      - name: Set the values known only after provisioning
        if: inputs.mode == 'provision'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          if [[ "$TARGET" == topup ]]; then
            name=TOPUP_GATEWAY_DOMAIN value=$(deploy/phala-cvm.sh gateway-domain "$WORK/cvm.json")
          else
            name=$ORIGIN_VARIABLE value=$PUBLIC_URL
          fi
          env "$name=$value" "$DIR/render-compose.sh" >"$COMPOSE"
          echo "$name=$value" | tee -a "$GITHUB_ENV"
          "$DIR/preflight.sh" --env "$ENV_FILE" --compose "$COMPOSE" --offline --unsealed
          previous=$(jq -er '.compose_hash | ascii_downcase | ltrimstr("0x")' "$WORK/cvm.json")
          deploy/phala-cvm.sh deploy "$WORK/deploy-public-url.json" \
            --cvm-id "$CVM_ID" \
            --compose "$COMPOSE" \
            --no-public-logs \
            --no-public-sysinfo \
            --wait
          deploy/phala-cvm.sh wait "$CVM_ID" "$previous" >"$WORK/cvm.json"

      # After an upgrade the attestation can still describe the previous compose for a while.
      - name: Read back and verify the attested compose
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          deployed=$(jq -er '.compose_hash | ascii_downcase | ltrimstr("0x")' "$WORK/cvm.json")
          deploy/phala-cvm.sh attestation "$CVM_ID" "$deployed" >"$WORK/attestation.json"
          # The guest agent's public info (port 8090, public tcbinfo) carries the vm_config.
          curl -fsS --max-time 30 --retry 5 --retry-all-errors \
            "$(deploy/phala-cvm.sh url "$WORK/cvm.json" 8090)/prpc/Info" >"$WORK/info.json"
          policy=()
          [[ "$TARGET" == topup ]] || policy=("$DIR/staging.env.example" "product:$PORT")
          deploy/verify-attestation.sh "$WORK/attestation.json" "$WORK/info.json" "$APP_ID" \
            "$COMPOSE" "${policy[@]}" 2>&1 | tee "$WORK/verification.txt"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Compose hash | \`0x$deployed\` |"
            echo "| Public URL | $PUBLIC_URL |"
            if [[ "$TARGET" == product ]]; then
              echo "| Webhook URL | $PUBLIC_URL/webhooks |"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # tls-alpn-01 (dstack-ingress README, "Certificates without DNS credentials"): the TXT record
      # names the instance, from the event log the verifier replayed, so the gateway routes the
      # domain to this CVM alone; dstack-ingress requests the certificate only once both records
      # resolve. An upgrade keeps the instance id; a new instance (a restore) needs a new TXT value.
      - name: Print the owner's DNS records
        if: inputs.target == 'topup'
        run: |
          instance_id=$(jq -er '[.tcb_info.event_log[] | select(.event == "instance-id")
            | .event_payload | ascii_downcase | select(test("^[0-9a-f]{40}$"))] | select(length == 1)[0]' \
            "$WORK/attestation.json")
          {
            echo "### Owner: DNS records for \`$TOPUP_DOMAIN\`"
            echo
            echo "In the domain's Cloudflare zone, DNS only (not proxied); keep them unchanged while this"
            echo "instance serves the domain:"
            echo
            echo "| Type | Name | Content |"
            echo "|---|---|---|"
            echo "| CNAME | \`$TOPUP_DOMAIN\` | \`$TOPUP_GATEWAY_DOMAIN\` |"
            echo "| TXT | \`_dstack-app-address.$TOPUP_DOMAIN\` | \`$instance_id:443\` |"
            echo
            echo "Optional, once the certificate is issued: CAA \`$TOPUP_DOMAIN\`"
            echo "\`0 issue \"letsencrypt.org;validationmethods=tls-alpn-01;accounturi=<ACME account>\"\`, with"
            echo "the account that \`deploy/verify-ingress-evidence.sh $TOPUP_DOMAIN $APP_ID\` prints."
          } >>"$GITHUB_STEP_SUMMARY"

      # A new topup CVM's PostgreSQL cannot list the backup prefix until the owner seals the
      # storage credentials, so it refuses to initialize and the service is not up yet. The product
      # serves without its seed. topup answers on its domain only with the records above in place
      # and the certificate issued (curl verifies it).
      - name: Wait for the service
        if: inputs.target == 'product' || inputs.mode == 'upgrade'
        run: deploy/phala-cvm.sh healthz "$PUBLIC_URL"

      - name: Verify the certificate evidence
        if: inputs.target == 'topup' && inputs.mode == 'upgrade'
        run: |
          deploy/verify-ingress-evidence.sh "$TOPUP_DOMAIN" "$APP_ID" 2>&1 |
            tee "$WORK/ingress-evidence.txt"
          { echo '```text'; cat "$WORK/ingress-evidence.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      - name: Print the owner's sealing step
        if: inputs.mode == 'provision'
        run: |
          {
            if [[ "$TARGET" == topup ]]; then
              env_file=.env.$DEPLOY_ENVIRONMENT
              echo "### Owner: seal the runtime secrets"
              echo
              echo "The CVM waits for its storage credentials: PostgreSQL refuses to initialize until"
              echo "it can list the backup prefix, so the service is not up yet. From your own machine,"
              echo "write \`$env_file\` (mode 0600) with exactly the staging.env.example names:"
              echo "\`AWS_ACCESS_KEY_ID\`, \`AWS_SECRET_ACCESS_KEY\`, \`SENTRY_DSN\` (may be empty), and"
              echo "\`TOPUP_RPC_PROVIDER_A_KEY\`, \`TOPUP_RPC_PROVIDER_B_KEY\` (the key for a \`{key}\` in the"
              echo "provider's URL; empty for a keyless URL). The same name set keeps the compose hash."
            else
              env_file=.env.product
              echo "### Owner: seal the product's API key"
              echo
              echo "The product runs without its Phala Pay key: webhooks and fulfillment are served,"
              echo "the account API answers 503. From your own machine, write \`$env_file\` with the"
              echo "single line \`PRODUCT_API_KEY=<the account's ppay_sk_test_ key>\` (mode 0600)."
            fi
            echo "From a checkout of \`$GITHUB_SHA\`, with \`$COMPOSE_NAME\` from this run's artifact:"
            echo
            echo '```sh'
            echo "$DIR/preflight.sh --env $env_file --compose $COMPOSE_NAME --offline"
            echo "npx --yes phala@1.1.22 envs update $CVM_ID -e $env_file"
            echo '```'
            if [[ "$TARGET" == topup ]]; then
              echo
              echo "The service answers $PUBLIC_URL/healthz once the CVM has restarted with the"
              echo "secrets and the DNS records above resolve, and backups have started when the"
              echo "newest archived WAL segment is younger than two minutes:"
              echo
              echo '```sh'
              echo "aws s3 ls \"${WALG_S3_PREFIX%/}/wal_005/\" --endpoint-url \"$AWS_ENDPOINT\" | tail -1"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # No secrets: the compose holds the public settings and references to the sealed secrets,
      # and the CLI outputs hold ids, hashes, and the attested app-compose.
      - name: Upload the deployment record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.environment }}-${{ inputs.target }}-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/deploy/docker-compose.*.yml
            ${{ runner.temp }}/deploy/release/images.json
            ${{ runner.temp }}/deploy/deploy.json
            ${{ runner.temp }}/deploy/deploy-public-url.json
            ${{ runner.temp }}/deploy/cvm.json
            ${{ runner.temp }}/deploy/attestation.json
            ${{ runner.temp }}/deploy/info.json
            ${{ runner.temp }}/deploy/verification.txt
            ${{ runner.temp }}/deploy/ingress-evidence.txt

      - name: Delete the env file and CLI state
        if: always()
        run: |
          [[ -z "${ENV_FILE:-}" ]] || rm -f "$ENV_FILE" "$ENV_FILE.new"
          [[ -z "${PHALA_CLOUD_DIR:-}" ]] || rm -rf "$PHALA_CLOUD_DIR"
          [[ -z "${WORK:-}" ]] || rm -rf "$WORK"
