name: Release

# A versioned release of the service (deploy/README.md, "Releases"), from a `v<version>` tag on a
# commit of main whose Cargo workspace version is <version> (CONTRIBUTING.md, "Releasing the
# service"). A stable version needs its dated CHANGELOG.md section, the release notes; a version
# with a pre-release suffix (`-rc.1`) is published as a GitHub pre-release.
#
# `images` builds and publishes the images the attested composes pin, tagged v<version>:
# - phala-pay: deploy/verify-image.sh builds it twice from clean, compares the OCI manifest and
#   config digests, builds and pushes a third time, and fails unless the registry's platform
#   manifest and config equal the verified local ones. Anyone rebuilds the same digest from the tag.
# - postgres-walg: apt and dpkg record wall-clock times, so two builds differ; it is built and
#   pushed once, the registry tag must resolve to the digest BuildKit pushed, and that digest,
#   pulled from the registry, must run `wal-g --version`.
# - phala-pay-reference-product (deploy/Dockerfile.reference-product, the staging reference
#   product): the same two-build, push, and read-back discipline as phala-pay, and the digest,
#   pulled from the registry, must run `--help`.
# Each digest gets a GitHub build provenance attestation (actions/attest-build-provenance), also
# pushed to the registry. `release` then publishes the GitHub release, whose assets are:
# - images.json: the manifest references (`repository@sha256:...`) by image name, deploy/render.sh's
#   --images;
# - phala-pay-deploy-v<version>.tar.gz: the deploy kit (deploy/build-kit.sh), `git archive` of the
#   tag's deployment files;
# - phala-cloud-template.yml: the Phala Cloud template's compose, rendered from the kit with these
#   images (deploy/render.sh --template);
# - SHA256SUMS over the three.
# Each asset gets a build provenance attestation, which operators check with `gh attestation
# verify` (docs/self-hosting.md, "Verify a release").
#
# Runner constraints (org self-hosted runner): the runner is a container that drives the host Docker
# daemon through its socket. Builds send their context over the socket and nothing bind-mounts a
# workspace path; the OCI archives and read-backs stay in runner.temp. `ss` and `envsubst` are not
# used. The release job runs on a GitHub-hosted runner, which has the GitHub CLI.

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  images:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, the version, and the changelog
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          cargo_version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [[ "$cargo_version" == "$version" ]] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match the Cargo workspace version $cargo_version"; exit 1; }
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME is not a commit of main"; exit 1; }
          [[ "$version" == *-* ]] || sdk/changelog-section.sh CHANGELOG.md "$version" >/dev/null
          {
            echo "version=$version"
            echo "source_date_epoch=$(git log -1 --pretty=%ct)"
          } >>"$GITHUB_OUTPUT"
      # The repository owner's GHCR namespace; GHCR names are lowercase, which expressions cannot do.
      - name: Choose the image repositories
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "TOPUP_REPOSITORY=$namespace/phala-pay"
            echo "POSTGRES_WALG_REPOSITORY=$namespace/postgres-walg"
            echo "REFERENCE_PRODUCT_REPOSITORY=$namespace/phala-pay-reference-product"
          } >>"$GITHUB_ENV"
      # The OCI exporter and rewrite-timestamp need a BuildKit builder; the runner's Docker driver has none.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish phala-pay after two matching reproducible builds
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
          PUBLISH_IMAGE: ${{ env.TOPUP_REPOSITORY }}:${{ github.ref_name }}
          IMAGE_REF_FILE: ${{ runner.temp }}/topup.ref
          # The runner context is only available at step level.
          TMPDIR: ${{ runner.temp }}
        run: deploy/verify-image.sh
      - name: Publish postgres-walg and read it back
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
          IMAGE: ${{ env.POSTGRES_WALG_REPOSITORY }}:${{ github.ref_name }}
        run: |
          metadata="$RUNNER_TEMP/postgres-walg-metadata.json"
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false \
            --sbom=false \
            --file deploy/Dockerfile.postgres-walg \
            --metadata-file "$metadata" \
            --output "type=image,name=$IMAGE,push=true,unpack=false,rewrite-timestamp=true,oci-mediatypes=true" \
            .
          # Single platform without attestations: BuildKit pushes one image manifest, no index.
          pushed_digest=$(jq -er '."containerimage.digest"' "$metadata")
          registry_digest="sha256:$(docker buildx imagetools inspect "$IMAGE" --raw | sha256sum | awk '{print $1}')"
          if [ "$registry_digest" != "$pushed_digest" ]; then
            echo "registry tag $IMAGE is $registry_digest, BuildKit pushed $pushed_digest" >&2
            exit 1
          fi
          ref="$POSTGRES_WALG_REPOSITORY@$pushed_digest"
          # Drop the builder's local copy so the smoke run executes what the registry serves.
          docker image rm "$IMAGE" >/dev/null 2>&1 || true
          docker run --rm --pull=always "$ref" wal-g --version
          docker image rm "$ref" >/dev/null || true
          printf '%s\n' "$ref" >"$RUNNER_TEMP/postgres-walg.ref"
      - name: Publish phala-pay-reference-product after two matching reproducible builds
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.source_date_epoch }}
          DOCKERFILE: deploy/Dockerfile.reference-product
          PUBLISH_IMAGE: ${{ env.REFERENCE_PRODUCT_REPOSITORY }}:${{ github.ref_name }}
          IMAGE_REF_FILE: ${{ runner.temp }}/reference-product.ref
          TMPDIR: ${{ runner.temp }}
        run: |
          deploy/verify-image.sh
          ref=$(cat "$IMAGE_REF_FILE")
          # Drop the builder's local copy so the smoke run executes what the registry serves.
          docker image rm "$PUBLISH_IMAGE" >/dev/null 2>&1 || true
          docker run --rm --pull=always "$ref" --help >/dev/null
          docker image rm "$ref" >/dev/null || true
      - name: Write images.json
        id: images
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          jq -n --rawfile topup "$RUNNER_TEMP/topup.ref" \
            --rawfile postgres_walg "$RUNNER_TEMP/postgres-walg.ref" \
            --rawfile product "$RUNNER_TEMP/reference-product.ref" \
            '{"phala-pay": ($topup | rtrimstr("\n")), "postgres-walg": ($postgres_walg | rtrimstr("\n")),
              "phala-pay-reference-product": ($product | rtrimstr("\n"))}' \
            >"$RUNNER_TEMP/images/images.json"
          for name in phala-pay postgres-walg phala-pay-reference-product; do
            echo "$name=$(jq -er --arg name "$name" '.[$name] | split("@")[1]' "$RUNNER_TEMP/images/images.json")"
          done | tr - _ >>"$GITHUB_OUTPUT"
      - name: Attest phala-pay
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.TOPUP_REPOSITORY }}
          subject-digest: ${{ steps.images.outputs.phala_pay }}
          push-to-registry: true
      - name: Attest postgres-walg
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.POSTGRES_WALG_REPOSITORY }}
          subject-digest: ${{ steps.images.outputs.postgres_walg }}
          push-to-registry: true
      - name: Attest phala-pay-reference-product
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REFERENCE_PRODUCT_REPOSITORY }}
          subject-digest: ${{ steps.images.outputs.phala_pay_reference_product }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-${{ github.ref_name }}
          path: ${{ runner.temp }}/images/images.json
          if-no-files-found: error
      # The host daemon keeps pushed tags in its image store; remove this run's tags, not their cache.
      - name: Remove this run's image tags from the host
        if: always()
        env:
          TOPUP: ${{ env.TOPUP_REPOSITORY }}:${{ github.ref_name }}
          POSTGRES_WALG: ${{ env.POSTGRES_WALG_REPOSITORY }}:${{ github.ref_name }}
          PRODUCT: ${{ env.REFERENCE_PRODUCT_REPOSITORY }}:${{ github.ref_name }}
        run: docker image rm "$TOPUP" "$POSTGRES_WALG" "$PRODUCT" 2>/dev/null || true

  release:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.images.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images-${{ github.ref_name }}
          path: ${{ runner.temp }}/dist
      # The kit renders every environment it ships and Phala's own, with these images, before
      # anything is published; the template's compose is rendered from the kit itself.
      - name: Build the deploy kit and render the Phala Cloud template from it
        run: |
          dist="$RUNNER_TEMP/dist"
          deploy/build-kit.sh "$GITHUB_REF_NAME" "$dist"
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit"
          tar -xzf "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" -C "$kit" --strip-components=1
          for environment in "$kit/deploy/environments/example/topup" deploy/environments/phala-network/*/*/; do
            "$kit/deploy/render.sh" --images "$dist/images.json" --gateway-domain gateway.release.invalid \
              "$environment" >/dev/null
          done
          "$kit/deploy/render.sh" --template --images "$dist/images.json" \
            "$kit/deploy/environments/phala-cloud-template/topup" >"$dist/phala-cloud-template.yml"
          (cd "$dist" && sha256sum images.json "phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            phala-cloud-template.yml >SHA256SUMS)
          cat "$dist/SHA256SUMS"
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/images.json
            ${{ runner.temp }}/dist/phala-pay-deploy-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/dist/phala-cloud-template.yml
            ${{ runner.temp }}/dist/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/dist"
          notes="$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
            echo "Pre-release of the changes under [Unreleased] in CHANGELOG.md." >"$notes"
          else
            sdk/changelog-section.sh CHANGELOG.md "$VERSION" >"$notes"
          fi
          {
            echo
            echo "## Deploy"
            echo
            echo "Deploy an environment directory with this release's kit and images, after verifying"
            echo "both ([self-hosting guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-hosting.md)):"
            echo
            echo '```sh'
            echo "gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY"
            echo "sha256sum -c SHA256SUMS"
            echo "for asset in images.json phala-pay-deploy-$GITHUB_REF_NAME.tar.gz phala-cloud-template.yml; do"
            echo "  gh attestation verify \"\$asset\" -R $GITHUB_REPOSITORY \\"
            echo "    --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF"
            echo "done"
            echo '```'
            echo
            echo '```json'
            cat "$dist/images.json"
            echo '```'
          } >>"$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Phala Pay $VERSION" \
            --notes-file "$notes" "${prerelease[@]}" \
            "$dist/images.json" "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            "$dist/phala-cloud-template.yml" "$dist/SHA256SUMS"
          cat "$notes" >>"$GITHUB_STEP_SUMMARY"
