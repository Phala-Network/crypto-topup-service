name: Release

# A versioned release of the service (deploy/README.md, "Releases"), from a `v<version>` tag on a
# commit of main whose Cargo workspace version is <version> (CONTRIBUTING.md, "Releasing the
# service"). A stable version needs its dated CHANGELOG.md section, the release notes; a version
# with a pre-release suffix (`-rc.1`) is published as a GitHub pre-release. The repository's tag
# ruleset lets only admins create, move, or delete `v*` tags, and releases are immutable once
# published.
#
# `checks` refuses the tag unless it names the version, is a commit of main, and every check that
# main's ruleset requires passed on that commit (it waits for CI's push run).
#
# The image jobs build, publish, and attest the images the attested composes pin, tagged
# v<version>, each on its own GitHub-hosted runner, so every attestation names a GitHub-hosted build
# (verified with --deny-self-hosted-runners):
# - phala-pay: deploy/verify-image.sh builds it twice from clean, compares the OCI manifest and
#   config digests, builds and pushes a third time, and fails unless the registry's platform
#   manifest and config equal the verified local ones. Anyone rebuilds the same digest from the tag.
# - postgres-walg: apt and dpkg record wall-clock times, so two builds differ; it is built and
#   pushed once, the registry tag must resolve to the digest BuildKit pushed, and that digest,
#   pulled from the registry, must run `wal-g --version`.
# - phala-pay-reference-product (deploy/Dockerfile.reference-product, the staging reference
#   product): the same two-build, push, and read-back discipline as phala-pay, and the digest,
#   pulled from the registry, must run `--help`.
# Each digest gets a GitHub build provenance attestation (actions/attest-build-provenance), also
# pushed to the registry. `release` then publishes the GitHub release, whose assets are:
# - images.json: the manifest references (`repository@sha256:...`) by image name, deploy/render.sh's
#   --images;
# - phala-pay-deploy-v<version>.tar.gz: the deploy kit (deploy/build-kit.sh), whose tar is
#   identical to `git archive` of the tag's deployment files;
# - phala-cloud-template.yml: the Phala Cloud template's compose, rendered from the kit with these
#   images (deploy/render.sh --template);
# - SHA256SUMS over the three.
# Each asset gets a build provenance attestation, which operators check with `gh attestation
# verify --cert-identity` of this workflow at the tag (docs/self-hosting.md, "Verify a release").

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, the version, and the changelog
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::tag $GITHUB_REF_NAME is not v<semver>"; exit 1; }
          cargo_version=$(sed -n '/^\[workspace.package\]$/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [[ "$cargo_version" == "$version" ]] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match the Cargo workspace version $cargo_version"; exit 1; }
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME is not a commit of main"; exit 1; }
          [[ "$version" == *-* ]] || sdk/changelog-section.sh CHANGELOG.md "$version" >/dev/null
          {
            echo "version=$version"
            echo "source_date_epoch=$(git log -1 --pretty=%ct)"
          } >>"$GITHUB_OUTPUT"
      # The checks main's ruleset requires, each by its app, as the latest run on the tagged commit:
      # all must succeed. CI's push run on main may still be running when the tag is pushed.
      - name: Wait for main's required checks on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq \
            '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]
              | {context, app: .integration_id}]' >"$RUNNER_TEMP/required.json"
          jq -e 'length > 0' "$RUNNER_TEMP/required.json" >/dev/null ||
            { echo "::error::main's ruleset requires no check; refusing to release unchecked"; exit 1; }
          for _ in $(seq 1 200); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, app: .app.id, id, status, conclusion}' |
              jq -s . >"$RUNNER_TEMP/runs.json"
            jq -r --slurpfile runs "$RUNNER_TEMP/runs.json" '.[] | . as $check
              | ([$runs[0][] | select(.name == $check.context and ($check.app == null or .app == $check.app))]
                 | max_by(.id)) as $run
              | "\($check.context) \(if $run == null then "missing" elif $run.status != "completed"
                  then "pending" else $run.conclusion end)"' \
              "$RUNNER_TEMP/required.json" >"$RUNNER_TEMP/states"
            if grep -Ev ' (success|missing|pending)$' "$RUNNER_TEMP/states"; then
              echo "::error::a required check did not pass on $GITHUB_SHA"
              exit 1
            fi
            if ! grep -Eq ' (missing|pending)$' "$RUNNER_TEMP/states"; then
              cat "$RUNNER_TEMP/states"
              exit 0
            fi
            sleep 30
          done
          cat "$RUNNER_TEMP/states"
          echo "::error::main's required checks did not finish on $GITHUB_SHA"
          exit 1

  phala-pay:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Three from-scratch Rust release builds; the runner's preinstalled SDKs are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The OCI exporter and rewrite-timestamp need a BuildKit builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish phala-pay after two matching reproducible builds
        id: publish
        env:
          SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.source_date_epoch }}
          IMAGE_REF_FILE: ${{ runner.temp }}/image.ref
          TMPDIR: ${{ runner.temp }}
        run: |
          export PUBLISH_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phala-pay:$GITHUB_REF_NAME"
          deploy/verify-image.sh
          echo "ref=$(cat "$IMAGE_REF_FILE")" >>"$GITHUB_OUTPUT"
      - name: Split the reference
        id: subject
        env:
          REF: ${{ steps.publish.outputs.ref }}
        run: '{ echo "name=${REF%@*}"; echo "digest=${REF#*@}"; } >>"$GITHUB_OUTPUT"'
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true

  postgres-walg:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish postgres-walg and read it back
        id: publish
        env:
          SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.source_date_epoch }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postgres-walg"
          image="$repository:$GITHUB_REF_NAME"
          metadata="$RUNNER_TEMP/postgres-walg-metadata.json"
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false \
            --sbom=false \
            --file deploy/Dockerfile.postgres-walg \
            --metadata-file "$metadata" \
            --output "type=image,name=$image,push=true,unpack=false,rewrite-timestamp=true,oci-mediatypes=true" \
            .
          # Single platform without attestations: BuildKit pushes one image manifest, no index.
          pushed_digest=$(jq -er '."containerimage.digest"' "$metadata")
          registry_digest="sha256:$(docker buildx imagetools inspect "$image" --raw | sha256sum | awk '{print $1}')"
          if [ "$registry_digest" != "$pushed_digest" ]; then
            echo "registry tag $image is $registry_digest, BuildKit pushed $pushed_digest" >&2
            exit 1
          fi
          ref="$repository@$pushed_digest"
          docker run --rm --pull=always "$ref" wal-g --version
          { echo "ref=$ref"; echo "name=$repository"; echo "digest=$pushed_digest"; } >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  reference-product:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish phala-pay-reference-product after two matching reproducible builds
        id: publish
        env:
          SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.source_date_epoch }}
          DOCKERFILE: deploy/Dockerfile.reference-product
          IMAGE_REF_FILE: ${{ runner.temp }}/image.ref
          TMPDIR: ${{ runner.temp }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/phala-pay-reference-product"
          export PUBLISH_IMAGE="$repository:$GITHUB_REF_NAME"
          deploy/verify-image.sh
          ref=$(cat "$IMAGE_REF_FILE")
          docker image rm "$PUBLISH_IMAGE" >/dev/null 2>&1 || true
          docker run --rm --pull=always "$ref" --help >/dev/null
          { echo "ref=$ref"; echo "name=$repository"; echo "digest=${ref#*@}"; } >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  release:
    needs: [checks, phala-pay, postgres-walg, reference-product]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write images.json
        env:
          TOPUP: ${{ needs.phala-pay.outputs.ref }}
          POSTGRES_WALG: ${{ needs.postgres-walg.outputs.ref }}
          PRODUCT: ${{ needs.reference-product.outputs.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          jq -n --arg topup "$TOPUP" --arg postgres_walg "$POSTGRES_WALG" --arg product "$PRODUCT" \
            '{"phala-pay": $topup, "postgres-walg": $postgres_walg, "phala-pay-reference-product": $product}' \
            >"$RUNNER_TEMP/dist/images.json"
          cat "$RUNNER_TEMP/dist/images.json"
      # The kit renders every environment it ships and Phala's own, with these images, before
      # anything is published; the template's compose is rendered from the kit itself.
      - name: Build the deploy kit and render the Phala Cloud template from it
        run: |
          dist="$RUNNER_TEMP/dist"
          deploy/build-kit.sh "$GITHUB_REF_NAME" "$dist"
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit"
          tar -xzf "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" -C "$kit" --strip-components=1
          for environment in "$kit/deploy/environments/example/topup" deploy/environments/phala-network/*/*/; do
            "$kit/deploy/render.sh" --images "$dist/images.json" --gateway-domain gateway.release.invalid \
              "$environment" >/dev/null
          done
          "$kit/deploy/render.sh" --template --images "$dist/images.json" \
            "$kit/deploy/environments/phala-cloud-template/topup" >"$dist/phala-cloud-template.yml"
          (cd "$dist" && sha256sum images.json "phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            phala-cloud-template.yml >SHA256SUMS)
          cat "$dist/SHA256SUMS"
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/images.json
            ${{ runner.temp }}/dist/phala-pay-deploy-${{ github.ref_name }}.tar.gz
            ${{ runner.temp }}/dist/phala-cloud-template.yml
            ${{ runner.temp }}/dist/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist="$RUNNER_TEMP/dist"
          notes="$RUNNER_TEMP/notes.md"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
            echo "Pre-release of the changes under [Unreleased] in CHANGELOG.md." >"$notes"
          else
            sdk/changelog-section.sh CHANGELOG.md "$VERSION" >"$notes"
          fi
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          {
            echo
            echo "## Deploy"
            echo
            echo "Deploy an environment directory with this release's kit and images, after verifying"
            echo "both ([self-hosting guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/self-hosting.md#verify-a-release)):"
            echo
            echo '```sh'
            echo "gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY"
            echo "sha256sum -c SHA256SUMS"
            echo "provenance=(-R $GITHUB_REPOSITORY --source-ref $GITHUB_REF --deny-self-hosted-runners"
            echo "  --cert-identity $identity)"
            echo "for asset in images.json phala-pay-deploy-$GITHUB_REF_NAME.tar.gz phala-cloud-template.yml; do"
            echo "  gh attestation verify \"\$asset\" \"\${provenance[@]}\""
            echo "done"
            echo "for image in \$(jq -r '.[]' images.json); do"
            echo "  gh attestation verify \"oci://\$image\" \"\${provenance[@]}\""
            echo "done"
            echo '```'
            echo
            echo '```json'
            cat "$dist/images.json"
            echo '```'
          } >>"$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Phala Pay $VERSION" \
            --notes-file "$notes" "${prerelease[@]}" \
            "$dist/images.json" "$dist/phala-pay-deploy-$GITHUB_REF_NAME.tar.gz" \
            "$dist/phala-cloud-template.yml" "$dist/SHA256SUMS"
          cat "$notes" >>"$GITHUB_STEP_SUMMARY"
