name: Release SDKs

# Publishes an SDK from the tagged commit, after its tests pass on that commit:
# - `sdk-js-v<version>`: sdk/js to npm as @phala/pay;
# - `sdk-py-v<version>`: sdk/python to PyPI (its `project.name`, phala-pay).
# The tag must name the version in package.json or pyproject.toml, and the package's CHANGELOG.md
# (Keep a Changelog 1.1.0) must have that version's dated section: it becomes the GitHub release's
# notes once the package is published (CONTRIBUTING.md, "Releasing an SDK").
#
# Publishing uses trusted publishing (OIDC) only: no token or secret is stored anywhere. The owner
# registers this repository, this workflow file (release-sdks.yml), and the `release` environment
# as the trusted publisher on npmjs.com and on pypi.org, and may add required reviewers to the
# environment. npm's trusted publishing does not support self-hosted runners, so the publish jobs
# run on GitHub-hosted runners. npm refuses provenance from a private repository: `--provenance`
# fails until the repository is public.

on:
  push:
    tags:
      - "sdk-js-v*"
      - "sdk-py-v*"

permissions:
  contents: read

concurrency:
  group: release-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  js-test:
    if: startsWith(github.ref_name, 'sdk-js-v')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "sdk-js-v$version" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - name: The changelog has this version's section
        run: ../changelog-section.sh CHANGELOG.md "${GITHUB_REF_NAME#sdk-js-v}"
      - uses: ./.github/actions/sdk-js
      - name: Typecheck, lint, unit tests, and build
        run: pnpm run check
      # Chromium runs in Playwright's image: the runner lacks its system libraries.
      - name: End-to-end tests on Anvil
        run: pnpm run e2e:docker

  js-publish:
    needs: js-test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/sdk-js
        with:
          e2e: "false"
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      # `prepare` builds dist from the checked-out tag.
      - name: Publish to npm with provenance
        # BOOTSTRAP ONLY: npm registers a trusted publisher only for a package that exists, so the
        # first version of @phala/pay is published with a short-lived token stored as the `release`
        # environment secret NPM_TOKEN. Remove this env and the secret once the trusted publisher
        # is registered; without a token npm publishes with OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  py-test:
    if: startsWith(github.ref_name, 'sdk-py-v')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: The tag names the project version
        run: |
          version="$(uv version --short --project sdk/python)"
          test "sdk-py-v$version" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1; }
      - name: The changelog has this version's section
        run: sdk/changelog-section.sh sdk/python/CHANGELOG.md "${GITHUB_REF_NAME#sdk-py-v}"
      - name: Lint, type-check, test, and check that client regeneration is a no-op
        run: make sdk-check
      - name: Build the sdist and wheel
        run: uv build --project sdk/python --out-dir "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-python-dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  py-publish:
    needs: py-test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The GitHub release of the tag, with the changelog section as its notes, once the package is on
  # its registry.
  github-release:
    needs: [js-publish, py-publish]
    if: always() && contains(needs.*.result, 'success') && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            sdk-js-v*) changelog=sdk/js/CHANGELOG.md package=@phala/pay ;;
            sdk-py-v*) changelog=sdk/python/CHANGELOG.md package=phala-pay ;;
          esac
          version=${GITHUB_REF_NAME##*-v}
          sdk/changelog-section.sh "$changelog" "$version" >"$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ "$version" != *-* ]] || prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$package $version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
