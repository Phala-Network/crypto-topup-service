name: Release SDKs

# Publishes an SDK from the tagged commit, after its tests pass on that commit:
# - `sdk-js-v<version>`: sdk/js to npm as @phala/crypto-topup.
#
# Publishing uses trusted publishing (OIDC) only: no token or secret is stored anywhere. The owner
# registers this repository, this workflow file (release-sdks.yml), and the `release` environment
# as the trusted publisher on npmjs.com, and may add required reviewers to the environment.
# Trusted publishing does not support self-hosted runners, so the publish jobs run on
# GitHub-hosted runners. npm refuses provenance from a private repository: `--provenance` fails
# until the repository is public.

on:
  push:
    tags:
      - "sdk-js-v*"

permissions:
  contents: read

concurrency:
  group: release-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  js-test:
    if: startsWith(github.ref_name, 'sdk-js-v')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "sdk-js-v$version" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - uses: ./.github/actions/sdk-js
      - name: Typecheck, lint, unit tests, and build
        run: pnpm run check
      - name: End-to-end tests on Anvil
        run: pnpm run e2e

  js-publish:
    needs: js-test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/sdk-js
        with:
          e2e: "false"
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      # `prepare` builds dist from the checked-out tag.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
