name: Deploy Phala's instance

# Phala's own deployments (deploy/phala.md): the reusable Deploy workflow with a release's
# verified kit and images, and this repository's committed environment directory
# deploy/environments/phala-network/<Environment>/<target>. Unlike an operator's caller, which
# pins Deploy at the release, a local `uses:` cannot name a release: the Deploy workflow is this
# repository's main (which must include the release), while the kit, the images, and every script
# a run executes are the chosen `version`'s (deploy/README.md, "Deploy"). Dispatched from main by
# a user with write access; see deploy.yml for what a run checks and does.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      target:
        description: "topup: the service CVM (vars.TOPUP_CVM_ID); product: the staging reference-product CVM (vars.STAGING_PRODUCT_CVM_ID)"
        type: choice
        options: [topup, product]
        required: true
      mode:
        description: "provision: create the target's first CVM; upgrade: update the target's CVM"
        type: choice
        options: [provision, upgrade]
        required: true
      version:
        description: "The release to deploy, v<version> (Releases)"
        type: string
        required: true

permissions:
  contents: read
  attestations: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
      target: ${{ inputs.target }}
      mode: ${{ inputs.mode }}
      environment_dir: deploy/environments/phala-network/${{ inputs.environment }}/${{ inputs.target }}
    secrets: inherit
