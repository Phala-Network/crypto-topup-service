name: Deploy contracts (Sepolia)

# Deploys the ForwarderFactory to Sepolia exactly as deploy/CONTRACTS.md describes: dry run, then
# (only with the input `broadcast: true`) broadcast, then verification on both providers. The
# constructor inputs come from the committed deploy/contracts/safe-expectations.json.
#
# Controls: dispatch needs write access, the job runs only from `main`, and the deployer key is the
# `staging` Environment secret SEPOLIA_DEPLOYER_PRIVATE_KEY. It reaches forge only through the
# environment (the script reads it with vm.envUint), never as a command-line argument, so it is not
# visible in the runner's process list. Mainnet is not deployed from CI; it stays HUMAN-ONLY
# through the Finance Safe process in deploy/CONTRACTS.md.

on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Broadcast the deployment (false: dry run only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-contracts
  cancel-in-progress: false

# `bash -eo pipefail` for every step, so a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: staging
    timeout-minutes: 45
    env:
      BROADCAST: ${{ inputs.broadcast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3

      - name: Deploy the factory
        env:
          PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          RPC_A: ${{ secrets.TOPUP_RPC_PROVIDER_A_URL }}
        run: |
          [[ -n "$PRIVATE_KEY" ]] ||
            { echo "::error::Environment secret SEPOLIA_DEPLOYER_PRIVATE_KEY is not set"; exit 1; }
          [[ -n "$RPC_A" ]] ||
            { echo "::error::Environment secret TOPUP_RPC_PROVIDER_A_URL is not set"; exit 1; }
          ADMIN=$(jq -er .admin deploy/contracts/safe-expectations.json)
          TREASURY=$(jq -er .treasury deploy/contracts/safe-expectations.json)
          export ADMIN TREASURY
          deploy/contracts/deploy-proxy.sh --rpc-url "$RPC_A"
          deploy/contracts/deploy-factory.sh --rpc sepolia/a="$RPC_A" --dry-run
          if [[ "$BROADCAST" == true ]]; then
            deploy/contracts/deploy-factory.sh --rpc sepolia/a="$RPC_A" --broadcast
          fi

      - name: Verify the deployment on both providers
        if: inputs.broadcast
        env:
          RPC_A: ${{ secrets.TOPUP_RPC_PROVIDER_A_URL }}
          RPC_B: ${{ secrets.TOPUP_RPC_PROVIDER_B_URL }}
        run: |
          mkdir -p reports
          ADMIN=$(jq -er .admin deploy/contracts/safe-expectations.json) \
          TREASURY=$(jq -er .treasury deploy/contracts/safe-expectations.json) \
            deploy/contracts/verify-deployment.sh --rpc sepolia/a="$RPC_A" --rpc sepolia/b="$RPC_B" \
            >reports/sepolia-contract-verification.json
          jq -e '.passed == true' reports/sepolia-contract-verification.json

      # Forge's run records (transactions, receipts, addresses; no key) and the verification report.
      - name: Upload the deployment manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sepolia-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            contracts/broadcast/DeployFactory.s.sol/11155111/
            reports/

      # Forge's script cache holds this run's transaction data; nothing of it stays on the runner.
      - name: Remove forge script state
        if: always()
        run: rm -rf contracts/cache/DeployFactory.s.sol contracts/broadcast/DeployFactory.s.sol
