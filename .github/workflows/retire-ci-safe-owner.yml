name: Retire CI-held test Safe owner

# One-time staging operation, removed after it has run once. The Sepolia test Safe is owned by the
# key in the `staging` Environment secret SEPOLIA_DEPLOYER_PRIVATE_KEY. This moves ownership to the
# owner-held address given as input, sends the key's remaining test ETH there, and verifies the
# result; afterwards the secret is deleted and the key is dead.
#
# `cast` accepts a raw key only as an argument, so the key is briefly visible in the runner's
# process list; that is acceptable only because this run retires the key.

on:
  workflow_dispatch:
    inputs:
      new_owner:
        description: Address that becomes the Safe's only owner
        required: true

permissions:
  contents: read

concurrency:
  group: retire-ci-safe-owner
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  retire:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Only from main
        run: |
          test "$GITHUB_REF" = refs/heads/main ||
            { echo "::error::runs only from main, not $GITHUB_REF"; exit 1; }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - name: Swap the Safe owner and sweep the key's balance
        env:
          SAFE: "0x936c1991f8dA9a919fa11b557a3514719f5A4504"
          NEW_OWNER: ${{ inputs.new_owner }}
          KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          RPC: ${{ vars.TOPUP_RPC_PROVIDER_B_URL || secrets.TOPUP_RPC_PROVIDER_B_URL }}
        run: |
          [[ $NEW_OWNER =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::new_owner is not an address"; exit 1; }
          [ "$(cast chain-id --rpc-url "$RPC")" = 11155111 ] || { echo "::error::not Sepolia"; exit 1; }
          old=$(cast wallet address --private-key "$KEY")
          owners=$(cast call "$SAFE" 'getOwners()(address[])' --rpc-url "$RPC")
          echo "owners before: $owners"
          [ "${owners,,}" = "[${old,,}]" ] || { echo "::error::Safe is not owned solely by the CI key"; exit 1; }

          data=$(cast calldata 'swapOwner(address,address,address)' \
            0x0000000000000000000000000000000000000001 "$old" "$NEW_OWNER")
          # Safe "approved hash" signature: r = owner, s = 0, v = 1, valid when msg.sender is that owner.
          owner_word=$(printf '%064s' "${old#0x}" | tr ' ' 0)
          signature="0x${owner_word}$(printf '%064d' 0)01"
          zero=0x0000000000000000000000000000000000000000
          cast send "$SAFE" \
            'execTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes)' \
            "$SAFE" 0 "$data" 0 0 0 0 "$zero" "$zero" "$signature" \
            --private-key "$KEY" --rpc-url "$RPC" >/dev/null

          owners=$(cast call "$SAFE" 'getOwners()(address[])' --rpc-url "$RPC")
          threshold=$(cast call "$SAFE" 'getThreshold()(uint256)' --rpc-url "$RPC")
          echo "owners after: $owners, threshold $threshold"
          [ "${owners,,}" = "[${NEW_OWNER,,}]" ] && [ "$threshold" = 1 ] ||
            { echo "::error::owner swap did not take effect"; exit 1; }

          price=$(cast gas-price --rpc-url "$RPC")
          fee=$((price * 2 * 21000))
          balance=$(cast balance "$old" --rpc-url "$RPC")
          if [ "$balance" -gt "$fee" ]; then
            cast send "$NEW_OWNER" --value $((balance - fee)) --gas-limit 21000 \
              --gas-price $((price * 2)) --private-key "$KEY" --rpc-url "$RPC" >/dev/null
          fi
          {
            echo "Safe \`$SAFE\` owner: \`$NEW_OWNER\` (threshold 1)."
            echo "Retired key \`$old\` balance left: $(cast balance "$old" --ether --rpc-url "$RPC") ETH."
            echo "Now delete the SEPOLIA_DEPLOYER_PRIVATE_KEY secret and this workflow."
          } >>"$GITHUB_STEP_SUMMARY"
