# Generator configuration for src/topup_client. Run `make generate`; never edit the output by hand.
# Post hooks run inside the generated package directory.
package_name_override: topup_client
project_name_override: topup-client
post_hooks:
  - "ruff check . --fix-only --quiet"
  - "ruff format . --quiet"
# Enums (the single-value `object` of each object, the error `type`) are `Literal` types.
literal_enums: true
