[workspace]
members = ["crates/adapters", "crates/core", "crates/topup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
axum = { version = "=0.8.9", features = ["json", "query", "tokio"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
hex = "=0.4.3"
proptest = "=1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
utoipa = { version = "=5.5.0", features = ["chrono", "uuid"] }
utoipa-axum = "=0.2.0"
uuid = { version = "=1.26.1", features = ["serde", "v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 1
