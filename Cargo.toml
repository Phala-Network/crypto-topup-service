[workspace]
members = ["crates/adapters", "crates/core", "crates/topup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
clap = { version = "4.5.48", features = ["derive"] }
noyalib = { version = "=0.0.48", default-features = false, features = ["std", "strict-deserialise"] }
proptest = "=1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
uuid = { version = "=1.26.1", features = ["v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 1
