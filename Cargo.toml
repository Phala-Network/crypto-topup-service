[workspace]
members = ["crates/adapters", "crates/conformance", "crates/core", "crates/topup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy = { version = "=1.0.41", default-features = false, features = ["provider-http", "reqwest-rustls-tls", "rpc-types", "sol-types"] }
alloy-consensus = { version = "=1.0.41", default-features = false, features = ["k256", "std"] }
alloy-eips = { version = "=1.0.41", default-features = false, features = ["std"] }
alloy-network = { version = "=1.0.41", default-features = false }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "serde"] }
alloy-provider = { version = "=1.0.41", default-features = false, features = ["reqwest"] }
alloy-rpc-client = { version = "=1.0.41", default-features = false }
alloy-rpc-types-eth = { version = "=1.0.41", default-features = false, features = ["serde"] }
alloy-serde = { version = "=1.0.41", default-features = false }
alloy-signer = { version = "=1.0.41", default-features = false }
alloy-signer-local = { version = "=1.0.41", default-features = false }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-transport = { version = "=1.0.41", default-features = false }
anyhow = "=1.0.104"
async-trait = "=0.1.89"
alloy-tx-macros = { version = "=1.0.41", default-features = false }
axum = { version = "=0.8.9", features = ["json", "query", "tokio"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
croner = "=4.0.0"
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
hex = "=0.4.3"
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
proptest = "=1.11.0"
rand = "=0.9.5"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
secrecy = "=0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.145"
sfv = "=0.15.0"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
static_assertions = "=1.1.0"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
utoipa = { version = "=5.5.0", features = ["chrono", "uuid"] }
utoipa-axum = "=0.2.0"
url = "=2.5.7"
uuid = { version = "=1.26.1", features = ["serde", "v4", "v5"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 1
