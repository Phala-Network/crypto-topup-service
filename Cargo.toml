[workspace]
members = ["crates/adapters", "crates/core", "crates/topup"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
alloy-consensus = { version = "=1.0.32", default-features = false, features = ["std"] }
alloy-eips = { version = "=1.0.32", default-features = false, features = ["std"] }
alloy-primitives = { version = "=1.4.1", default-features = false, features = ["std"] }
alloy-signer-local = { version = "=1.0.32", default-features = false }
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "zeroize"] }
hex = "=0.4.3"
secrecy = "=0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
static_assertions = "=1.1.0"
tokio = { version = "=1.47.1", features = ["rt", "net"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["json"] }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 1
